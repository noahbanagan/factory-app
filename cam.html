<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dynamic Intl CAM</title>
<style>
:root{--pan:#F0F0F0;--bd:#A0A0A0;--bd2:#C8C8C8;--sel:#3399FF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:12px "Segoe UI",Tahoma,Arial,sans-serif;color:#111;background:var(--pan);overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
input,select,button,textarea{font:inherit;color:inherit}
input,textarea{user-select:text;-webkit-user-select:text}
#title{height:24px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;background:linear-gradient(#DCE6F4,#C3D2E9);border-bottom:1px solid #9AAAC4}
#title b{color:#1B3D7A}#title a{color:#1B3D7A;font-size:11px}
#menu{display:flex;flex:none;background:#fff;border-bottom:1px solid var(--bd2);height:22px;position:relative;z-index:30;overflow-x:auto;overflow-y:visible}
.mi{padding:3px 9px;cursor:default;white-space:nowrap}
.mi:hover,.mi.open{background:#CCE4F7}
.dd{position:fixed;min-width:240px;background:#F5F5F5;border:1px solid #979797;box-shadow:2px 3px 6px rgba(0,0,0,.25);padding:2px;z-index:60}
.dd>div{padding:4px 18px 4px 24px;white-space:nowrap;display:flex;justify-content:space-between;gap:24px;cursor:default}
.dd>div:hover{background:#91C9F7}
.dd>div.dis{color:#999}.dd>div.dis:hover{background:none}
.dd hr{border:none;border-top:1px solid #D7D7D7;margin:3px 2px 3px 24px}
.dd kbd{color:#666;font:inherit}
#tbar{display:flex;flex:none;flex-wrap:wrap;gap:1px;padding:2px 4px;background:linear-gradient(#FDFDFE,#E2E6EC);border-bottom:1px solid var(--bd);align-items:center}
.tb{min-width:26px;height:26px;border:1px solid transparent;border-radius:2px;background:none;display:inline-flex;align-items:center;justify-content:center;cursor:default;font-size:14px;line-height:1;color:#123;padding:0 3px}
.tb:hover{border-color:#7DA2CE;background:linear-gradient(#EAF3FC,#D2E4F8)}
.tb.on{border-color:#5C8ACB;background:#C2DAF5}
.tb.wiz{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(#4C8BE0,#2458B0);border-color:#1B3D7A;padding:0 10px}
.tb small{font-size:11px;font-weight:700}
.tsep{width:1px;background:#B8BCC3;margin:3px 3px;height:20px}
#ribbon{display:none;flex:none;align-items:center;gap:8px;padding:3px 8px;background:linear-gradient(#FBFCFD,#E3E8EF);border-bottom:1px solid var(--bd);flex-wrap:wrap}
#ribbon.on{display:flex}
#ribbon b{color:#1B3D7A;margin-right:4px}
#ribbon label{display:flex;align-items:center;gap:3px}
#ribbon input[type=number]{width:74px;height:21px;border:1px solid #8E9AAD;padding:0 3px}
#ribbon select{height:21px;border:1px solid #8E9AAD}
#main{flex:1;display:flex;min-height:0}
#mgr{width:340px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--bd);background:#fff;min-height:0}
#mgr.hide{display:none}
#mgrHead{padding:3px 6px;background:linear-gradient(#F7F8FA,#DDE3EB);border-bottom:1px solid var(--bd2);font-weight:600;color:#1B3D7A}
#mgrBar{display:flex;flex-wrap:wrap;gap:1px;padding:2px;border-bottom:1px solid var(--bd2);background:#F7F7F7}
#mgrBar .tb{min-width:24px;height:24px;font-size:13px}
#mgrBody{flex:1;overflow:auto;padding:3px 0;min-height:0}
#mgrTabs{display:flex;background:var(--pan);border-top:1px solid var(--bd)}
#mgrTabs button{padding:4px 12px;border:none;border-right:1px solid var(--bd2);background:none;cursor:default}
#mgrTabs button.on{background:#fff;font-weight:600;color:#1B3D7A}
.tn{display:flex;align-items:center;white-space:nowrap;height:20px;padding-right:6px;cursor:default}
.tn .tw{width:14px;flex:none;text-align:center;color:#555;font-size:9px}
.tn .ic{width:20px;flex:none;text-align:center;font-size:12px}
.tn .lb{padding:1px 3px;border:1px dotted transparent}
.tn.sel>.lb{background:var(--sel);color:#fff}
.tn:hover>.lb{border-color:#9BB}
.tn.dim{color:#888}
.ok-ic{color:#1E9E2E}.bad-ic{color:#D0312D}
#gfx{flex:1;position:relative;min-width:0;min-height:0;background:linear-gradient(#97ADCF,#FFFFFF 88%);overflow:hidden}
#gfx canvas{display:block;outline:none}
#prompt{position:absolute;top:6px;left:8px;font-weight:600;color:#000;pointer-events:none;text-shadow:0 0 3px #fff;max-width:70%}
#vlabel{position:absolute;left:8px;bottom:6px;font-size:11px;color:#000;pointer-events:none}
#scale{position:absolute;right:10px;bottom:6px;font-size:11px;color:#333;pointer-events:none}
#rubber{position:absolute;border:1px dashed #000;background:rgba(51,153,255,.12);display:none;pointer-events:none}
#snap{position:absolute;width:12px;height:12px;border:2px solid #E00;margin:-6px 0 0 -6px;display:none;pointer-events:none}
#snaptxt{position:absolute;font-size:10px;color:#E00;display:none;pointer-events:none;font-weight:700}
#busy{position:absolute;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;font-weight:600;color:#1B3D7A;font-size:14px;z-index:5}
#sbar{height:24px;flex:none;display:flex;align-items:center;background:linear-gradient(#F7F8FA,#DEE2E8);border-top:1px solid var(--bd);font-size:11px;overflow-x:auto;white-space:nowrap}
.sb{padding:0 10px;border-right:1px solid #B7BCC4;height:100%;display:flex;align-items:center;gap:4px;cursor:default}
.sb:hover{background:#D9E6F5}
.sb select{height:18px;font-size:11px;border:1px solid #9AA}
#sbXY{min-width:180px;font-variant-numeric:tabular-nums}
.dlg{position:fixed;background:#F0F0F0;border:1px solid #6D7F9E;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:50;display:flex;flex-direction:column;min-width:240px;max-width:98vw;max-height:96vh}
.dlg .dt{height:26px;flex:none;display:flex;align-items:center;padding:0 4px 0 8px;background:linear-gradient(#5A8BD6,#2F5FAE);color:#fff;font-weight:600;cursor:move}
.dlg .dt span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg .dx{width:24px;height:18px;border:1px solid #fff8;background:#C9483B;color:#fff;border-radius:2px;font-size:11px;cursor:default}
.dlg .db{padding:8px;overflow:auto;flex:1;min-height:0}
.dlg .df{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:6px 8px;border-top:1px solid #D0D0D0;flex:none}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.08);z-index:49}
.ok,.cn,.hp{width:36px;height:26px;border:1px solid #8E9AAD;border-radius:2px;background:linear-gradient(#fff,#E2E6EC);font-size:16px;line-height:1;cursor:default;font-weight:700}
.ok{color:#1E9E2E}.cn{color:#D0312D}.hp{color:#2563C9}
.ok:hover,.cn:hover,.hp:hover,.btn:hover{border-color:#5C8ACB;background:linear-gradient(#EAF3FC,#CFE2F7)}
.btn{height:23px;padding:0 10px;border:1px solid #8E9AAD;border-radius:2px;background:linear-gradient(#fff,#E2E6EC);cursor:default;white-space:nowrap}
.btn.on{background:#C2DAF5;border-color:#5C8ACB}
.btn.big{height:34px;font-size:13px;font-weight:600;padding:0 16px}
.btn.pri{background:linear-gradient(#4C8BE0,#2458B0);color:#fff;border-color:#1B3D7A;height:26px}
.df .btn.pri{width:auto;min-width:90px}
.pg2{display:flex;gap:8px;min-height:390px}
.nav{width:200px;flex:none;border:1px solid #A9B3C2;background:#fff;overflow:auto;padding:3px 0}
.nav div{padding:3px 8px;white-space:nowrap;cursor:default}
.nav div.sub{padding-left:24px}
.nav div.on{background:var(--sel);color:#fff}
.nav div:not(.on):hover{background:#E5F1FB}
.nav div.basic{font-weight:700;color:#1B3D7A;border-bottom:1px solid #D7DCE4;margin-bottom:3px}
.nav div.basic.on{color:#fff}
.pc{flex:1;min-width:320px}
fieldset{border:1px solid #BFC7D3;padding:6px 8px 8px;margin-bottom:8px;background:#F7F7F7}
legend{padding:0 4px;color:#1B3D7A;font-weight:600}
.fr{display:flex;align-items:center;gap:6px;margin:3px 0;min-height:22px;flex-wrap:wrap}
.fr>span{flex:1;min-width:130px}
.fr input[type=number],.fr input[type=text],.fr select{width:120px;height:21px;border:1px solid #8E9AAD;background:#fff;padding:0 3px}
.fr input[type=checkbox]{width:14px;height:14px}
.fr .rad{display:flex;gap:6px;font-size:11px;width:150px}
.fr .rad label{display:flex;align-items:center;gap:2px}
.hint{width:100%;font-size:11px;color:#5A6472;margin:-2px 0 4px;line-height:1.35}
.tabs2{display:flex;gap:2px;border-bottom:1px solid #A9B3C2;margin-bottom:8px}
.tabs2 button{padding:4px 12px;border:1px solid #A9B3C2;border-bottom:none;background:linear-gradient(#FAFAFA,#E4E7EC);border-radius:3px 3px 0 0;cursor:default}
.tabs2 button.on{background:#fff;font-weight:600;position:relative;top:1px}
table.grid{border-collapse:collapse;width:100%;background:#fff}
table.grid th{background:linear-gradient(#FBFBFC,#E4E7EC);border:1px solid #C3C9D3;padding:2px 5px;font-weight:600;text-align:left;white-space:nowrap;position:sticky;top:0}
table.grid td{border:1px solid #E1E4E9;padding:2px 5px;white-space:nowrap}
table.grid tr.on td{background:var(--sel);color:#fff}
table.grid tr:not(.on):hover td{background:#E5F1FB}
.ttype{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ttype button{height:56px;border:1px solid #A9B3C2;background:#fff;border-radius:3px;cursor:default;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px}
.ttype button b{font-size:18px}
.ttype button.on{border:2px solid var(--sel);background:#E5F1FB}
.note{background:#FFFDE7;border:1px solid #E8D586;padding:6px 8px;margin-bottom:8px;line-height:1.4}
.info{background:#E8F1FB;border:1px solid #B5CDEB;padding:6px 8px;margin-bottom:8px;line-height:1.4;color:#123A6B}
.err{color:#B71C1C}
.warnl div{padding:3px 0;border-bottom:1px solid #eee}
textarea.nc{width:100%;height:100%;min-height:60vh;font:12px ui-monospace,Consolas,"Courier New",monospace;border:1px solid #8E9AAD;padding:4px;resize:none;white-space:pre;overflow:auto}
.bpinfo{font:11px ui-monospace,Consolas,monospace;background:#fff;border:1px solid #A9B3C2;padding:4px 6px;margin-top:6px;white-space:pre;overflow:hidden;min-height:58px}
.vcr{display:flex;gap:3px;align-items:center}
.vcr .btn{padding:0 8px;font-size:13px}
.wz{display:flex;gap:10px;min-height:360px}
.wz .steps{width:190px;flex:none;border-right:1px solid #C8CFD9;padding-right:8px}
.wz .steps div{padding:6px 8px;border-radius:3px;margin-bottom:3px;color:#555;cursor:default}
.wz .steps div.on{background:#2458B0;color:#fff;font-weight:600}
.wz .steps div.done{color:#1E9E2E}
.wz .body{flex:1;min-width:300px;line-height:1.45}
.wz h3{color:#1B3D7A;margin-bottom:6px;font-size:14px}
.wz p{margin-bottom:8px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.card{border:1px solid #A9B3C2;background:#fff;border-radius:4px;padding:8px 10px;cursor:default}
.card:hover{border-color:#2458B0;background:#EEF4FC}
.card b{display:block;font-size:13px;color:#1B3D7A;margin-bottom:2px}
.card.on{border:2px solid #2458B0;background:#E5F1FB}
.chk label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid #E3E6EB}
.chk input{margin-top:2px}
@media(max-width:900px){
  body{overflow:auto;height:auto}
  #main{flex-direction:column}
  #mgr{width:100%;height:42vh;border-right:none;border-bottom:1px solid var(--bd)}
  #gfx{height:62vh;flex:none}
  .pg2,.wz{flex-direction:column}
  .nav{width:auto;max-height:130px}
  .wz .steps{width:auto;border-right:none;display:flex;flex-wrap:wrap;gap:3px}
  .pc{min-width:0}
  .cards{grid-template-columns:1fr}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>

<body>
<div id="title"><b>Dynamic Intl CAM</b><span id="ttl"></span><span style="flex:1"></span><a href="index.html">◂ Production app</a></div>
<div id="menu"></div>
<div id="tbar"></div>
<div id="ribbon"></div>
<div id="main">
  <div id="mgr">
    <div id="mgrHead">Toolpath Manager</div>
    <div id="mgrBar"></div>
    <div id="mgrBody"></div>
    <div id="mgrTabs"><button data-t="tp" class="on">Toolpaths</button><button data-t="tools">Tools</button><button data-t="levels">Levels</button></div>
  </div>
  <div id="gfx"><div id="prompt"></div><div id="vlabel"></div><div id="scale"></div><div id="rubber"></div><div id="snap"></div><div id="snaptxt"></div><div id="busy">Calculating…</div></div>
</div>
<div id="sbar"></div>
<input type="file" id="fFile" hidden>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
const CL = window.ClipperLib;

/* ============================== utilities ============================== */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const rnd = v => +(+v).toFixed(4);
const hyp = Math.hypot;
const tick = () => new Promise(r => setTimeout(r, 0));
const clone = o => JSON.parse(JSON.stringify(o));
const isMM = () => S.setup.units === 'mm';
const K = () => isMM() ? 1 : 1/25.4;
const U = () => isMM() ? 'mm' : 'in';
const DEG = Math.PI/180;
function busy(on, t){ $('#busy').style.display = on ? 'flex' : 'none'; if (t) $('#busy').textContent = t; }
function prompt_(t){ $('#prompt').textContent = t || ''; }

/* ============================== state ============================== */
// Industry-standard reference values (general-purpose carbide end mills; HSS drills and taps). vc m/min; fz10 = chip load mm/tooth for a Ø10 end mill (scaled by diameter); fr10 = drill feed mm/rev at Ø10.
const MATS = {
  alu:{n:'ALUMINUM A2017/A5056/6061', vc:350, fz10:0.060, vcD:80, fr10:0.20, vcT:20, fam:'alu', note:'Free cutting. Sharp tools, flood coolant, high RPM. Chip-weld risk if feed too low.'},
  mild:{n:'MILD STEEL 1018/1045/S45C', vc:150, fz10:0.050, vcD:28, fr10:0.18, vcT:10, fam:'steel'},
  alloy:{n:'4140 / SCM440 (SOFT, UNHARDENED)', vc:120, fz10:0.045, vcD:22, fr10:0.15, vcT:8, fam:'steel', note:'Only mill in the soft state. If the drawing gives a hardness (e.g. 50-55 HRC), the part is hardened after machining: leave grind stock, or route to wire EDM / grinding.'},
  hard:{n:'HARDENED STEEL >40 HRC', vc:0, fz10:0, vcD:0, fr10:0, vcT:0, fam:'hard', note:'Not a milling job on this machine. Wire EDM (Mitsubishi BA24) or grinding.'},
  ss:{n:'SUS304 / SUS316 STAINLESS', vc:80, fz10:0.040, vcD:15, fr10:0.10, vcT:6, fam:'ss', note:'Work-hardens: never dwell or rub, keep the feed up, climb mill, fresh tools. Thin plate (< 3 mm) distorts — clamp well, light depth cuts.'},
  sscsp:{n:'SUS304CSP SPRING STAINLESS (THIN)', vc:0, fz10:0, vcD:0, fr10:0, vcT:0, fam:'hard', note:'Spring-temper sheet 0.3-2 mm: toothcombs, blades. Wire EDM job, not milling.'},
  ci:{n:'CAST IRON', vc:130, fz10:0.060, vcD:25, fr10:0.20, vcT:10, fam:'steel'}, brass:{n:'BRASS/BRONZE', vc:250, fz10:0.060, vcD:60, fr10:0.18, vcT:15, fam:'alu'},
  copper:{n:'COPPER / CU-CR ELECTRODE', vc:200, fz10:0.050, vcD:50, fr10:0.15, vcT:12, fam:'alu', note:'Gummy: sharp polished-flute tools, generous feed, coolant. Electrode mods are usually re-machining an existing part — check the datum carefully.'},
  plastic:{n:'POM (DELRIN) / NYLON', vc:400, fz10:0.070, vcD:60, fr10:0.20, vcT:15, fam:'plastic', note:'High RPM, sharp tools, air blast or light coolant. Clamp gently — it deflects.'},
  bakelite:{n:'BAKELITE / PHENOLIC / G10-G11', vc:200, fz10:0.050, vcD:40, fr10:0.15, vcT:10, fam:'plastic', note:'Abrasive dust: coolant OFF, vacuum extraction, carbide only, mask. Chips at the exit edge — chamfer or back with scrap.'}
};
// Chevalier QP1620-L / Fanuc 0i-MD. Dealer figures — confirm against the machine's own plate and parameters.
const MACHINE = {name:'Chevalier QP1620-L', control:'FANUC 0i-MD', post:'Generic FANUC 3X Mill', travel:{x:520, y:400, z:380}, maxRpm:10000, rpmCap:8000, rapid:48000, maxFeed:10000, taper:'BT40', tools:20}; // rpmCap = shop policy for the 2019 belt-drive spindle; maxRpm = machine capability
const TT = {flat:['Flat endmill','▮'], bull:['Bull endmill','▮'], ball:['Ball endmill','◖'], face:['Face mill','▬'], chamfer:['Chamfer mill','▼'],
  drill:['Drill','⇣'], spot:['Spot drill','▽'], center:['Center drill','▿'], tap:['Tap RH','⌇'], ream:['Reamer','┃'], bore:['Boring bar','┣']};
const MILLS = ['flat', 'bull', 'ball', 'face', 'chamfer'];
function mkTool(o){ return Object.assign({id:uid(), num:1, name:'', type:'flat', dia:10, cr:0, tipDia:0, angle:118, flutes:3, len:30, oal:75, hOff:0, dOff:0, rpm:3000, feed:600, plunge:200, retract:1200, pitch:0, mat:'Carbide'}, o); }
function defTools(u){
  const T = (num, name, type, dia, o = {}) => mkTool(Object.assign({num, name, type, dia, hOff:num, dOff:num}, o));
  if (u === 'mm') return [
    T(1, '50. FACE MILL', 'face', 50, {flutes:5, len:10, rpm:2500, feed:2000, plunge:600, retract:3000}),
    T(2, '10. FLAT ENDMILL', 'flat', 10, {rpm:10000, feed:1800, plunge:540, retract:3000}),
    T(3, '6. FLAT ENDMILL', 'flat', 6, {len:20, rpm:10000, feed:1200, plunge:360, retract:3000}),
    T(4, '6. BALL-NOSE ENDMILL', 'ball', 6, {flutes:2, len:20, rpm:10000, feed:650, plunge:200, retract:3000}),
    T(5, '8. SPOT DRILL', 'spot', 8, {flutes:2, angle:90, mat:'HSS', rpm:3200, feed:270, plunge:270}),
    T(6, '6.8 DRILL', 'drill', 6.8, {flutes:2, len:45, mat:'HSS', rpm:3700, feed:570, plunge:570}),
    T(7, 'M8 X 1.25 TAP RH', 'tap', 8, {len:25, mat:'HSS', rpm:800, feed:1000, plunge:1000, pitch:1.25}),
    T(8, '10. CHAMFER MILL 90DEG', 'chamfer', 10, {flutes:4, angle:90, tipDia:1, len:5, rpm:10000, feed:1700, plunge:500, retract:3000}),
    T(9, '12. BULL ENDMILL R1.', 'bull', 12, {cr:1, flutes:4, len:30, rpm:9300, feed:2500, plunge:750, retract:3000})
  ];
  return [
    T(1, '2. FACE MILL', 'face', 2, {flutes:5, len:0.4, rpm:1000, feed:20, plunge:12, retract:80}),
    T(2, '1/2 FLAT ENDMILL', 'flat', 0.5, {len:1.25, rpm:2400, feed:20, plunge:10, retract:80}),
    T(3, '1/4 FLAT ENDMILL', 'flat', 0.25, {len:0.75, rpm:4500, feed:18, plunge:8, retract:80}),
    T(4, '1/4 BALL-NOSE ENDMILL', 'ball', 0.25, {flutes:2, len:0.75, rpm:5000, feed:32, plunge:12, retract:80}),
    T(5, '3/8 SPOT DRILL', 'spot', 0.375, {flutes:2, angle:90, rpm:1500, feed:5, plunge:8}),
    T(6, '#7 DRILL', 'drill', 0.201, {flutes:2, len:1.75, rpm:1400, feed:6, plunge:10}),
    T(7, '1/4-20 TAP RH', 'tap', 0.25, {len:1, rpm:250, feed:12.5, plunge:12.5, pitch:0.05}),
    T(8, '3/8 CHAMFER MILL 90DEG', 'chamfer', 0.375, {flutes:4, angle:90, tipDia:0.04, len:0.2, rpm:3000, feed:18, plunge:8, retract:80}),
    T(9, '1/2 BULL ENDMILL R.03', 'bull', 0.5, {cr:0.03, flutes:4, len:1.25, rpm:2500, feed:28, plunge:12, retract:80})
  ];
}
function defSetup(u){

  return [[a[0] + (b[0]-a[0])*bt, a[1] + (b[1]-a[1])*bt]].concat(ring.slice(bk+1), ring.slice(0, bk+1));

}
function dp3(pts, tol){

  const st = [[0, pts.length-1]];
  while (st.length){

    const d = [B[0]-A[0], B[1]-A[1], B[2]-A[2]], L2 = d[0]*d[0]+d[1]*d[1]+d[2]*d[2];
    let bi = -1, bd = tol;
    for (let k = a+1; k < b; k++){

      const t = L2 ? Math.max(0, Math.min(1, (w[0]*d[0]+w[1]*d[1]+w[2]*d[2])/L2)) : 0;
      const e = hyp(w[0]-d[0]*t, w[1]-d[1]*t, w[2]-d[2]*t);
      if (e > bd){ bd = e; bi = k; }
    }
    if (bi > 0){ keep[bi] = 1; st.push([a, bi], [bi, b]); }

const arcTol = () => isMM() ? 0.005 : 0.0002;
class PB {

  add(g, x, y, z, f, ex){ const m = {g, x, y, z, f}; if (ex) Object.assign(m, ex); this.m.push(m); this.cur = {x, y, z}; }
  same(x, y, z){ const c = this.cur; return c && Math.abs(c.x-x) < 1e-9 && Math.abs(c.y-y) < 1e-9 && Math.abs(c.z-z) < 1e-9; }
  rapid(x, y, z){ if (!this.same(x, y, z)) this.add(0, x, y, z); }
  feed(x, y, z, f, ex){ if (!this.same(x, y, z)) this.add(1, x, y, z, f || this.c.feed, ex); }
  up(z){ if (this.cur && this.cur.z < z - 1e-9) this.rapid(this.cur.x, this.cur.y, z); }
  retract(){ this.up(this.c.retractZ); }
  chainGap(){ this.up(this.c.chainZ); }
  end(){ if (this.cur) this.up(this.c.safeZ); }
  enter(x, y, z){
    if (!this.cur) this.add(0, x, y, this.c.safeZ);
    else if (hyp(this.cur.x-x, this.cur.y-y) > 1e-9){ this.up(this.c.retractZ); this.rapid(x, y, this.cur.z); }
    if (this.cur.z > this.c.feedZ + 1e-9 && this.c.feedZ > z) this.rapid(x, y, this.c.feedZ);
    this.feed(x, y, z, this.c.plunge);
  }
  poly(pts, z, f){
    f = f || this.c.feed;
    const Z = p => p.length > 2 ? p[2] : z;
    if (!S.setup.post.arcs || pts.length < 3){ for (const p of pts) this.feed(p[0], p[1], Z(p), f); return; }
    const all = [[this.cur.x, this.cur.y, this.cur.z]].concat(pts);
    for (const s of arcFit(all, arcTol())){
      const zz = Z(all[s.k]);
      if (s.arc) this.add(s.cw ? 2 : 3, s.x, s.y, zz, f, {i:s.cx - this.cur.x, j:s.cy - this.cur.y});

    const g = ccw ? 3 : 2, sx = this.cur.x, sy = this.cur.y;
    this.add(g, 2*cx - sx, 2*cy - sy, z, f || this.c.feed, {i:cx - sx, j:cy - sy});
    this.add(g, sx, sy, z, f || this.c.feed, {i:sx - cx, j:sy - cy});
  }
}
function circ3(a, b, c){
  const d = 2*(a[0]*(b[1]-c[1]) + b[0]*(c[1]-a[1]) + c[0]*(a[1]-b[1]));

  const x = (a2*(b[1]-c[1]) + b2*(c[1]-a[1]) + c2*(a[1]-b[1]))/d, y = (a2*(c[0]-b[0]) + b2*(a[0]-c[0]) + c2*(b[0]-a[0]))/d;
  return [x, y, hyp(a[0]-x, a[1]-y)];
}
function arcFit(pts, tol){
  const out = [], n = pts.length, maxR = isMM() ? 2000 : 80;
  let i = 0;
  while (i < n - 1){
    let best = null;
    for (let j = i + 3; j < n; j++){
      const c = circ3(pts[i], pts[(i+j) >> 1], pts[j]);
      if (!c || c[2] > maxR) break;
      let ok = true, sgn = 0, sweep = 0;
      for (let k = i; k < j && ok; k++){
        const p = pts[k], q = pts[k+1];
        if (Math.abs(hyp(q[0]-c[0], q[1]-c[1]) - c[2]) > tol) ok = false;
        const cr = (p[0]-c[0])*(q[1]-c[1]) - (p[1]-c[1])*(q[0]-c[0]);

      best = {j, c, cw:sgn < 0};
    }
    if (best){ out.push({arc:true, k:best.j, x:pts[best.j][0], y:pts[best.j][1], cx:best.c[0], cy:best.c[1], cw:best.cw}); i = best.j; }
    else { out.push({k:i+1, x:pts[i+1][0], y:pts[i+1][1]}); i++; }
  }

}

function helixPts(cx, cy, R, zFrom, z, angle, ccw){
  const slope = Math.tan(Math.max(0.5, angle)*DEG), turns = Math.max(0.25, (zFrom - z)/(2*Math.PI*R*slope));

  return pts;

let down = null, snapP = null, SNAPS = null;
function ndc(e){ const r = R3.domElement.getBoundingClientRect(); return new THREE.Vector2(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1); }
function worldAt(e){ const rc = new THREE.Raycaster(); rc.setFromCamera(ndc(e), cam); const p = new THREE.Vector3(); return rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), p) ? p : null; }
function toScreen(x, y, z = 0){ const v = new THREE.Vector3(x, y, z).project(cam), r = R3.domElement.getBoundingClientRect(); return [(v.x + 1)/2*r.width, (1 - v.y)/2*r.height]; }
function hitItem(e){
  const rc = new THREE.Raycaster(); rc.setFromCamera(ndc(e), cam);
  rc.params.Line.threshold = pxWorld()*6;
  const hits = rc.intersectObjects(G.ent.children, false);
  return hits.length ? S.geom.items.find(i => i.id === hits[0].object.userData.item) : null;
}
function snapPoints(){
  const out = [[0, 0, 'Origin']];
  for (const it of S.geom.items){
    if (!visItem(it)) continue;
    if (it.kind === 'line'){ out.push([it.x1, it.y1, 'End'], [it.x2, it.y2, 'End'], [(it.x1+it.x2)/2, (it.y1+it.y2)/2, 'Mid']); }
    else if (it.kind === 'arc'){ const am = (it.a0 + it.a1)/2; out.push([it.cx, it.cy, 'Center'], [it.cx + it.r*Math.cos(it.a0), it.cy + it.r*Math.sin(it.a0), 'End'], [it.cx + it.r*Math.cos(it.a1), it.cy + it.r*Math.sin(it.a1), 'End'], [it.cx + it.r*Math.cos(am), it.cy + it.r*Math.sin(am), 'Mid']); }
    else if (it.kind === 'circle'){ out.push([it.cx, it.cy, 'Center']); for (let q = 0; q < 4; q++) out.push([it.cx + it.r*Math.cos(q*Math.PI/2), it.cy + it.r*Math.sin(q*Math.PI/2), 'Quad']); }
    else if (it.kind === 'point') out.push([it.x, it.y, 'Point']);
    else { const p = itemPts(it); out.push([p[0][0], p[0][1], 'End'], [p[p.length-1][0], p[p.length-1][1], 'End']); }
  }
  return out;
}
function findSnap(e){
  if (!SNAPS) SNAPS = snapPoints();
  const r = R3.domElement.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 10;
  for (const s of SNAPS){ const [sx, sy] = toScreen(s[0], s[1]); const d = hyp(sx - mx, sy - my); if (d < bd){ bd = d; best = s; } }
  return best;
}
function initPointer(){
  const cv = R3.domElement, rub = $('#rubber');

    const sm = $('#snap'), stx = $('#snaptxt');
    if (mode === 'create' || mode === 'dist' || mode === 'scale'){
      snapP = findSnap(e);
      if (snapP){ const [sx, sy] = toScreen(snapP[0], snapP[1]); sm.style.display = stx.style.display = 'block'; sm.style.left = sx + 'px'; sm.style.top = sy + 'px'; stx.style.left = (sx + 9) + 'px'; stx.style.top = (sy + 6) + 'px'; stx.textContent = snapP[2]; }
      else sm.style.display = stx.style.display = 'none';
      if (mode === 'create') createMove(snapP ? {x:snapP[0], y:snapP[1]} : w);
    } else sm.style.display = stx.style.display = 'none';
    if (down && (mode === null || mode === 'chain')){
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (hyp(dx, dy) > 5){ const r = $('#gfx').getBoundingClientRect(); rub.style.display = 'block'; rub.style.left = (Math.min(e.clientX, down.x) - r.left) + 'px'; rub.style.top = (Math.min(e.clientY, down.y) - r.top) + 'px'; rub.style.width = Math.abs(dx) + 'px'; rub.style.height = Math.abs(dy) + 'px'; }
    }
  });
  cv.addEventListener('pointerup', e => {
    if (e.button !== 0 || !down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y; rub.style.display = 'none';
    if (hyp(dx, dy) > 5 && (mode === null || mode === 'chain')){
      const r = cv.getBoundingClientRect(), a = [Math.min(e.clientX, down.x) - r.left, Math.min(e.clientY, down.y) - r.top], b = [Math.max(e.clientX, down.x) - r.left, Math.max(e.clientY, down.y) - r.top];
      const inside = pts => pts.every(p => { const [sx, sy] = toScreen(p[0], p[1]); return sx >= a[0] && sx <= b[0] && sy >= a[1] && sy <= b[1]; });
      if (mode === 'chain') chainWindow(inside);
      else { S.geom.items.filter(it => visItem(it) && inside(itemPts(it).filter((_, i, A) => i % Math.max(1, Math.floor(A.length/40)) === 0 || i === A.length - 1))).forEach(it => selEnt.add(it.id)); drawGeom(); updStatus(); }

    if (mode === 'create'){ createPick(snapP ? {x:snapP[0], y:snapP[1]} : w); return; }
    if (mode === 'dist'){ distPick(snapP ? {x:snapP[0], y:snapP[1]} : w); return; }
    if (mode === 'scale'){ scalePick(snapP ? {x:snapP[0], y:snapP[1]} : w); return; }
    if (mode === 'analyze'){ if (it) analyzeDlg(it); return; }
    if (mode === 'chain'){ if (it) chainClick(it, w); return; }
    if (it){ selEnt.has(it.id) ? selEnt.delete(it.id) : selEnt.add(it.id); }
    else selEnt.clear();

  });
}

/* ============================== verify ============================== */
async function runVerify(list, quality){
  const s = S.setup.stock, pts = expand(list);
  if (!pts.length) return null;
  const span = Math.max(s.x1 - s.x0, s.y1 - s.y0), res = Math.max(span/({fast:250, normal:450, fine:750}[quality] || 450), isMM() ? 0.03 : 0.0015);
  const nx = Math.ceil((s.x1 - s.x0)/res) + 1, ny = Math.ceil((s.y1 - s.y0)/res) + 1;
  const h = new Float32Array(nx*ny).fill(s.top), fps = new Map(), hits = [];
  busy(true, 'Verifying…'); await tick();
  for (let k = 1; k < pts.length; k++){
    const a = pts[k-1], b = pts[k];
    if (a.op !== b.op || Math.min(a.z, b.z) >= s.top) continue;
    let fp = fps.get(b.t); if (!fp){ fp = footprint(shapeOf(b.t), res); fps.set(b.t, fp); }
    const L = hyp(b.x - a.x, b.y - a.y, b.z - a.z), n = Math.max(1, Math.ceil(L/(res*0.7)));
    for (let q = 1; q <= n; q++){
      const x = a.x + (b.x - a.x)*q/n, y = a.y + (b.y - a.y)*q/n, z = a.z + (b.z - a.z)*q/n;
      if (z >= s.top) continue;
      const ci = Math.round((x - s.x0)/res), cj = Math.round((y - s.y0)/res);
      let hit = false;
      for (let m = 0; m < fp.di.length; m++){
        const ii = ci + fp.di[m], jj = cj + fp.dj[m];
        if (ii < 0 || jj < 0 || ii >= nx || jj >= ny) continue;
        const idx = jj*nx + ii, zz = z + fp.dr[m];
        if (h[idx] > zz + 1e-6){ if (b.rapid && h[idx] - zz > res*0.5) hit = true; h[idx] = zz; }
      }
      if (hit && hits.length < 100) hits.push({x, y, z, line:b.line, op:b.op.name});
    }
    if (k % 3000 === 0){ busy(true, `Verifying… ${Math.round(100*k/pts.length)}%`); await tick(); }
  }
  clearG(G.sim);
  const pos = new Float32Array(nx*ny*3), idx = [];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++){ const k = j*nx + i; pos[k*3] = s.x0 + i*res; pos[k*3+1] = s.y0 + j*res; pos[k*3+2] = Math.max(h[k], s.bottom); }
  for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++){ const a = j*nx + i; idx.push(a, a+1, a+nx, a+1, a+nx+1, a+nx); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  G.sim.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:0x8FBF6F, roughness:0.6, metalness:0.1, side:THREE.DoubleSide})));
  busy(false);
  return hits;
}

let zTop = 50;
function dlg({title, body, w, modal = true, ok, cancel, help, x, y, onClose, footer = true, extra = '', okLabel}){
  const bg = modal ? document.body.appendChild(Object.assign(document.createElement('div'), {className:'modal-bg'})) : null;
  const d = document.createElement('div'); d.className = 'dlg'; d.style.zIndex = ++zTop;
  d.innerHTML = `<div class="dt"><span>${esc(title)}</span><button class="dx" title="Close">✕</button></div><div class="db"></div>${footer ? `<div class="df">${extra}<span style="flex:1"></span>${okLabel ? `<button class="btn pri ok">${esc(okLabel)}</button>` : '<button class="ok" title="OK">✔</button>'}<button class="cn" title="Cancel">✖</button>${help ? '<button class="hp" title="Help">?</button>' : ''}</div>` : ''}`;
  document.body.appendChild(d);
  if (w) d.style.width = Math.min(w, innerWidth - 8) + 'px';
  const db = d.querySelector('.db'); if (typeof body === 'string') db.innerHTML = body; else if (body) db.appendChild(body);
  requestAnimationFrame(() => { const r = d.getBoundingClientRect(); d.style.left = Math.max(4, x != null ? x : (innerWidth - r.width)/2) + 'px'; d.style.top = Math.max(4, y != null ? y : (innerHeight - r.height)/2.4) + 'px'; });
  const close = () => { d.remove(); bg && bg.remove(); onClose && onClose(); };
  d.close = close;
  d.querySelector('.dx').onclick = () => { cancel ? cancel(close) : close(); };
  if (footer){
    d.querySelector('.ok').onclick = () => { ok ? ok(close) : close(); };
    d.querySelector('.cn').onclick = () => { cancel ? cancel(close) : close(); };
    if (help) d.querySelector('.hp').onclick = help;
  }
  const t = d.querySelector('.dt');
  t.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; const r = d.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top; d.style.zIndex = ++zTop;
    const mv = ev => { d.style.left = Math.max(0, ev.clientX - ox) + 'px'; d.style.top = Math.max(0, ev.clientY - oy) + 'px'; };
    const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up); });
  d.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && footer){ e.preventDefault(); d.querySelector('.ok').click(); } if (e.key === 'Escape'){ e.stopPropagation(); d.querySelector('.dx').click(); } });
  return d;
}

function ask(title, label, val){

function fRow(obj, k, label, kind = 'n', opts, hint){

let chainDlgEl = null;
function startChaining(type, initial, onOK, onCancel, title){
  endMode();
  const kind = OPDEF[type].chain === 'points' ? 'points' : 'chain';
  chainCtx = {type, kind, list:(initial || []).map(s => Object.assign({}, s)), mask:false, closedOnly:OPDEF[type].chain === 'closed'};
  mode = 'chain';
  const body = kind === 'points'
    ? `<div class="vcr" style="flex-wrap:wrap;gap:4px"><button class="btn" data-c="all">All circles/points</button><button class="btn" data-c="mask" title="Next pick selects every circle of that diameter">Same size as next pick</button><button class="btn" data-c="last">Unselect last</button><button class="btn" data-c="clear">Clear</button></div><div class="hint" style="margin-top:6px">Click the circles or points you want to drill. Drag a box to grab many at once. Click again to deselect.</div><div id="chcount" style="margin-top:6px;font-weight:600"></div>`
    : `<div class="vcr" style="flex-wrap:wrap;gap:4px"><button class="btn on" data-c="chainm">Chain</button><button class="btn" data-c="rev" title="Reverse direction of the last chain">⇄ Reverse</button><button class="btn" data-c="last">Unselect last</button><button class="btn" data-c="clear">Clear</button></div><div class="hint" style="margin-top:6px">Click one line or arc of the shape — connected pieces are picked up automatically. The green arrow shows the cutting direction (starts near where you clicked). Drag a box to chain many.</div><div id="chcount" style="margin-top:6px;font-weight:600"></div>`;
  chainDlgEl = dlg({title:title || 'Chaining', body, w:320, modal:false, x:($('#mgr').getBoundingClientRect().right || 0) + 8, y:($('#gfx').getBoundingClientRect().top || 80) + 30,
    ok:close => { const l = chainCtx.list; finish(); close(); onOK(l); },
    cancel:close => { finish(); close(); onCancel && onCancel(); }});
  const finish = () => { chainCtx = null; mode = null; prompt_(''); chainDlgEl = null; drawGeom(); };
  chainDlgEl.addEventListener('click', e => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    const L = chainCtx.list;
    if (b.dataset.c === 'all') chainCtx.list = CH.filter(c => c.circle || c.point).map(c => ({key:c.key}));
    if (b.dataset.c === 'mask'){ chainCtx.mask = !chainCtx.mask; b.classList.toggle('on', chainCtx.mask); }
    if (b.dataset.c === 'last') L.pop();
    if (b.dataset.c === 'clear') chainCtx.list = [];
    if (b.dataset.c === 'rev' && L.length){ const s = L[L.length-1]; s.rev = !s.rev; }
    chainUpd();
  });
  chainUpd();
}
function chainUpd(){
  if (!chainCtx) return;
  const n = chainCtx.list.length, el = $('#chcount');
  if (el) el.textContent = `${n} ${chainCtx.kind === 'points' ? 'point(s)' : 'chain(s)'} selected`;
  prompt_(chainCtx.kind === 'points' ? 'Select drill points, then ✔' : `Select chain ${n + 1}, then ✔`);
  drawGeom();
}
function chainClick(it, w){
  const c = ITEMCH.get(it.id); if (!c) return;
  const L = chainCtx.list, i = L.findIndex(s => s.key === c.key);
  if (chainCtx.kind === 'points'){
    if (!c.circle && !c.point){ prompt_('Pick a circle or point'); return; }
    if (chainCtx.mask && c.circle){ CH.filter(x => x.circle && Math.abs(x.circle.r - c.circle.r) < 1e-4 && !L.some(s => s.key === x.key)).forEach(x => L.push({key:x.key})); chainCtx.mask = false; $$('[data-c=mask]').forEach(b => b.classList.remove('on')); }
    else if (i >= 0) L.splice(i, 1); else L.push({key:c.key});
    chainUpd(); return;
  }
  if (i >= 0){ L.splice(i, 1); chainUpd(); return; }
  if (chainCtx.closedOnly && !c.closed){ prompt_('That chain is open — pockets need closed shapes'); return; }
  if (c.point) return;
  const s = {key:c.key, rev:false};
  if (c.closed){ s.rev = area(c.pts) > 0; if (w){ s.sx = w.x; s.sy = w.y; } }
  else if (w){ const a = c.pts[0], b = c.pts[c.pts.length-1]; s.rev = hyp(b[0]-w.x, b[1]-w.y) < hyp(a[0]-w.x, a[1]-w.y); }
  L.push(s); chainUpd();
}
function chainWindow(inside){
  const L = chainCtx.list;
  for (const c of CH){
    if (L.some(s => s.key === c.key)) continue;
    if (chainCtx.kind === 'points'){ if ((c.circle || c.point) && inside([c.circle ? [c.circle.cx, c.circle.cy] : c.pts[0]])) L.push({key:c.key}); }
    else if (!c.point && (!chainCtx.closedOnly || c.closed) && inside(c.pts.filter((_, i, A) => i % Math.max(1, Math.floor(A.length/40)) === 0))) L.push({key:c.key, rev:c.closed && area(c.pts) > 0});
  }
  chainUpd();
}
async function newOp(type){
  const op = newOpObj(type);

/* ---------- tools ---------- */
function calcSpeeds(t, ret){
  const m = MATS[S.setup.material], inch = !isMM(), D = inch ? t.dia*25.4 : t.dia;
  if (!(D > 0) || !(m.vc > 0)) return ret ? {rpm:0, feed:0, plunge:0} : t;
  // Speed/feed level: 100% = industry-standard values for a rigid setup; lower while learning, higher for production.
  const lvl = Math.max(30, Math.min(130, S.setup.safety || 100))/100, hss = /hss|cobalt/i.test(t.mat || ''), carbideDrill = !hss && ['drill','spot','center','ream'].includes(t.type);
  const dk = Math.max(0.25, Math.min(1.6, Math.pow(D/10, 0.75)));          // chip load grows with diameter
  const fzD = m.fz10*dk, frD = m.fr10*Math.max(0.2, Math.min(1.6, Math.pow(D/10, 0.7)));
  let vc, rpm, feed;
  if (['drill','spot','center'].includes(t.type)){ vc = m.vcD*(carbideDrill ? 2.5 : 1); rpm = vc*1000/(Math.PI*D); feed = rpm*frD*(t.type === 'drill' ? 1 : 0.5); }
  else if (t.type === 'tap'){ vc = m.vcT; rpm = vc*1000/(Math.PI*D); feed = rpm*(inch ? t.pitch*25.4 : t.pitch); }
  else if (t.type === 'ream' || t.type === 'bore'){ vc = m.vcD*(carbideDrill ? 2 : 0.6); rpm = vc*1000/(Math.PI*D); feed = rpm*frD*2; }
  else { vc = m.vc*(hss ? 0.35 : 1)*(t.type === 'face' ? 1.2 : 1); rpm = vc*1000/(Math.PI*D); feed = rpm*(t.flutes || 2)*fzD*(t.type === 'face' ? 1.5 : t.type === 'ball' ? 0.8 : t.type === 'chamfer' ? 0.7 : 1); }
  rpm *= lvl; feed *= lvl;
  if (rpm > S.setup.maxRpm){ feed *= S.setup.maxRpm/rpm; rpm = S.setup.maxRpm; }   // RPM-limited: keep the chip load, so feed drops with it
  if (t.type === 'tap') feed = rpm*(inch ? t.pitch*25.4 : t.pitch);
  const k = inch ? 1/25.4 : 1, r = {rpm:Math.max(50, Math.round(rpm/10)*10), feed:rnd(Math.round(feed*k*(inch ? 10 : 0.1))/(inch ? 10 : 0.1))};
  if (t.type === 'tap') r.feed = rnd(r.rpm*(inch ? t.pitch : t.pitch)*(inch ? 1 : 1));
  r.plunge = MILLS.includes(t.type) ? rnd(r.feed*0.3) : r.feed;
  r.basis = {vc_m_min:rnd(vc*lvl), fz_mm_tooth:+(fzD).toFixed(3), fr_mm_rev:+(frD).toFixed(3), tool_material:hss ? 'HSS' : 'carbide', level_pct:Math.round(lvl*100)};
  if (ret) return r;
  Object.assign(t, {rpm:r.rpm, feed:r.feed, plunge:r.plunge}); return t;
}

function xformItem(it, f, mir){
  if (it.kind === 'line'){ const a = f([it.x1, it.y1]), b = f([it.x2, it.y2]); return {...it, x1:a[0], y1:a[1], x2:b[0], y2:b[1]}; }
  if (it.kind === 'point'){ const a = f([it.x, it.y]); return {...it, x:a[0], y:a[1]}; }
  if (it.kind === 'poly') return {...it, pts:it.pts.map(f)};
  const c = f([it.cx, it.cy]), e = f([it.cx + it.r, it.cy]), r = hyp(e[0]-c[0], e[1]-c[1]);
  if (it.kind === 'circle') return {...it, cx:c[0], cy:c[1], r};
  const p0 = f([it.cx + it.r*Math.cos(it.a0), it.cy + it.r*Math.sin(it.a0)]), p1 = f([it.cx + it.r*Math.cos(it.a1), it.cy + it.r*Math.sin(it.a1)]);
  const st = mir ? p1 : p0, a0 = Math.atan2(st[1]-c[1], st[0]-c[0]);
  return normArc({...it, cx:c[0], cy:c[1], r, a0, a1:a0 + (it.a1 - it.a0)});
}
function xformAll(f, mir){

/* ---------- create (ribbon bar) ---------- */
const CREATE = {

  line:{t:'Line Endpoints', f:[['x1','X1'],['y1','Y1'],['x2','X2'],['y2','Y2'],['len','Length'],['ang','Angle']], picks:[['x1','y1'],['x2','y2']], auto:true},
  rect:{t:'Rectangle', f:[['w','Width'],['h','Height'],['x','Base X'],['y','Base Y'],['rad','Corner radius']], s:[['anchor','Anchor',SEL(['ll','Lower-left'],['c','Center'])]], picks:[['x','y']]},
  circle:{t:'Circle Center Point', f:[['cx','Center X'],['cy','Center Y'],['d','Diameter']], picks:[['cx','cy']]},
  arc:{t:'Arc Polar', f:[['cx','Center X'],['cy','Center Y'],['r','Radius'],['a0','Start angle'],['a1','End angle']], picks:[['cx','cy']]},
  bolt:{t:'Bolt Circle', f:[['cx','Center X'],['cy','Center Y'],['bcd','Bolt circle Ø'],['n','Holes'],['a0','Start angle'],['hd','Hole Ø']], picks:[['cx','cy']]}
};
function startCreate(kind){
  endMode();

  const V = {x:0, y:0, x1:0, y1:0, x2:rnd(50*k), y2:0, len:rnd(50*k), ang:0, w:rnd(100*k), h:rnd(60*k), rad:0, anchor:'ll', cx:0, cy:0, d:rnd(20*k), r:rnd(10*k), a0:0, a1:90, bcd:rnd(80*k), n:6, hd:rnd(8.5*k)};

  rb.innerHTML = `<b>${d.t}</b>${d.f.map(([key, l]) => `<label>${l}<input type="number" step="any" data-cf="${key}" value="${V[key]}"></label>`).join('')}${(d.s || []).map(([key, l, o]) => `<label>${l}<select data-cf="${key}">${o.map(([a, b]) => `<option value="${a}"${V[key] === a ? ' selected' : ''}>${b}</option>`).join('')}</select></label>`).join('')}<span style="flex:1"></span><button class="ok" id="crOk" title="Apply (Enter)">✔</button><button class="btn" id="crAp" title="Apply and continue">+</button><button class="cn" id="crX" title="Close (Esc)">✖</button>`;
  rb.classList.add('on');

function lineLA(){ const V = createCtx.V; V.len = rnd(hyp(V.x2 - V.x1, V.y2 - V.y1)); V.ang = rnd(Math.atan2(V.y2 - V.y1, V.x2 - V.x1)/DEG); }
function syncRibbon(){ $$('#ribbon [data-cf]').forEach(i => { if (document.activeElement !== i) i.value = createCtx.V[i.dataset.cf]; }); }
function createItems(){
  const {kind, V} = createCtx, out = [];
  if (kind === 'point') out.push({kind:'point', x:V.x, y:V.y});
  if (kind === 'line' && hyp(V.x2 - V.x1, V.y2 - V.y1) > 1e-9) out.push({kind:'line', x1:V.x1, y1:V.y1, x2:V.x2, y2:V.y2});
  if (kind === 'circle' && V.d > 0) out.push({kind:'circle', cx:V.cx, cy:V.cy, r:V.d/2});
  if (kind === 'arc' && V.r > 0) out.push(normArc({kind:'arc', cx:V.cx, cy:V.cy, r:V.r, a0:V.a0*DEG, a1:V.a1*DEG}));
  if (kind === 'bolt') for (let i = 0; i < Math.max(1, V.n|0); i++){ const a = (V.a0 + 360*i/Math.max(1, V.n|0))*DEG; out.push({kind:'circle', cx:V.cx + V.bcd/2*Math.cos(a), cy:V.cy + V.bcd/2*Math.sin(a), r:V.hd/2}); }
  if (kind === 'rect' && V.w > 0 && V.h > 0){
    const x0 = V.anchor === 'c' ? V.x - V.w/2 : V.x, y0 = V.anchor === 'c' ? V.y - V.h/2 : V.y, x1 = x0 + V.w, y1 = y0 + V.h, r = Math.max(0, Math.min(V.rad, V.w/2, V.h/2));
    if (r < 1e-9) out.push({kind:'line', x1:x0, y1:y0, x2:x1, y2:y0}, {kind:'line', x1:x1, y1:y0, x2:x1, y2:y1}, {kind:'line', x1:x1, y1:y1, x2:x0, y2:y1}, {kind:'line', x1:x0, y1:y1, x2:x0, y2:y0});
    else {
      const L = (a, b, c, d) => { if (hyp(c-a, d-b) > 1e-9) out.push({kind:'line', x1:a, y1:b, x2:c, y2:d}); };
      L(x0 + r, y0, x1 - r, y0); L(x1, y0 + r, x1, y1 - r); L(x1 - r, y1, x0 + r, y1); L(x0, y1 - r, x0, y0 + r);
      [[x1 - r, y0 + r, -90], [x1 - r, y1 - r, 0], [x0 + r, y1 - r, 90], [x0 + r, y0 + r, 180]].forEach(([cx, cy, a]) => out.push(normArc({kind:'arc', cx, cy, r, a0:a*DEG, a1:(a + 90)*DEG})));
    }
  }
  return out;
}
function preview(){
  clearG(G.prev); if (!createCtx) return;
  const mat = new THREE.LineBasicMaterial({color:0x00A000});
  for (const it of createItems()){
    const pts = it.kind === 'point' ? [[it.x - pxWorld()*5, it.y], [it.x + pxWorld()*5, it.y]] : itemPts(it);
    const g = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p[0], p[1], 0)));

}
function createMove(p){
  if (!createCtx || !p) return;
  const {kind, V, pick} = createCtx;
  if (kind === 'line' && pick === 1){ V.x2 = rnd(p.x); V.y2 = rnd(p.y); lineLA(); syncRibbon(); preview(); }
  if ((kind === 'circle' || kind === 'arc') && pick === 1){ const r = hyp(p.x - V.cx, p.y - V.cy); if (kind === 'circle') V.d = rnd(2*r); else V.r = rnd(r); syncRibbon(); preview(); }
}
function createPick(p){
  if (!createCtx || !p) return;
  const {kind, V} = createCtx, d = CREATE[kind];
  if ((kind === 'circle' || kind === 'arc') && createCtx.pick === 1){ applyCreate(); return; }
  const pk = d.picks[createCtx.pick];

  if (kind === 'line') lineLA();

  if (d.auto && createCtx.pick >= d.picks.length){
    applyCreate();

  } else if (createCtx.pick >= d.picks.length && kind !== 'circle' && kind !== 'arc') prompt_(`${d.t}: ✔ to create, or pick again`);

}

let running = false;
async function regen(list, quiet){
  while (running) await new Promise(r => setTimeout(r, 40)); // queue behind a running generation (assistant tool calls can arrive in parallel)
  running = true;

    for (const op of list){
      busy(true, `Regenerating ${op.name}…`); await tick();
      try { await genOp(op); } catch(e){ op.moves = []; op.warn = ['Error: ' + e.message]; console.error(e); }
    }
  } finally { busy(false); running = false; }
  drawPaths(); drawGeom(); renderMgr(); autosave();
  const w = list.flatMap(o => (o.warn || []).map(m => `<div>${esc(o.name)}: ${esc(m)}</div>`));

  if (!list.some(o => o.type === 'face') && st.stock.top > 1e-9) issues.push(['warn', `Stock top is Z${fmt(st.stock.top)} but there is no facing operation — Z0 must still be the finished top.`]);

  const out = []; let ctm = [1, 0, 0, 1, 0, 0]; const stack = []; let col = '0,0,0', lw = 1, pend = null;
  const mul = (a, b) => [a[0]*b[0] + a[2]*b[1], a[1]*b[0] + a[3]*b[1], a[0]*b[2] + a[2]*b[3], a[1]*b[2] + a[3]*b[3], a[0]*b[4] + a[2]*b[5] + a[4], a[1]*b[4] + a[3]*b[5] + a[5]];
  const T = (x, y) => [ctm[0]*x + ctm[2]*y + ctm[4], ctm[1]*x + ctm[3]*y + ctm[5]];
  const bez = (p0, p1, p2, p3) => { const n = 12, o = []; for (let k = 1; k <= n; k++){ const t = k/n, u = 1 - t; o.push([u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]]); } return o; };
  const emit = () => { if (!pend) return; for (const sp of pend) if (sp.pts.length > 1) out.push({color:col, w:lw, pts:sp.pts, closed:sp.closed}); pend = null; };
  for (let i = 0; i < fnArray.length; i++){
    const fn = fnArray[i], a = argsArray[i];
    if (fn === OPS.save) stack.push(ctm.slice());
    else if (fn === OPS.restore) ctm = stack.pop() || ctm;
    else if (fn === OPS.transform) ctm = mul(ctm, a);
    else if (fn === OPS.setStrokeRGBColor) col = Array.from(a).join(',');
    else if (fn === OPS.setStrokeGray) col = [a[0]*255|0, a[0]*255|0, a[0]*255|0].join(',');
    else if (fn === OPS.setStrokeCMYKColor) col = [255*(1-a[0])*(1-a[3])|0, 255*(1-a[1])*(1-a[3])|0, 255*(1-a[2])*(1-a[3])|0].join(',');
    else if (fn === OPS.setLineWidth) lw = a[0];
    else if (fn === OPS.constructPath){
      const ops = a[0], d = a[1], subs = []; let cur = null, k = 0, last = null;
      const start = p => { cur = {pts:[p], closed:false}; subs.push(cur); last = p; };
      for (const op of ops){
        if (op === OPS.moveTo){ start(T(d[k], d[k+1])); k += 2; }
        else if (op === OPS.lineTo){ const p = T(d[k], d[k+1]); k += 2; if (!cur) start(p); else { cur.pts.push(p); last = p; } }
        else if (op === OPS.curveTo){ const c1 = T(d[k], d[k+1]), c2 = T(d[k+2], d[k+3]), p = T(d[k+4], d[k+5]); k += 6; if (!cur) start(c1); cur.pts.push(...bez(last, c1, c2, p)); last = p; }
        else if (op === OPS.curveTo2){ const c2 = T(d[k], d[k+1]), p = T(d[k+2], d[k+3]); k += 4; if (!cur) start(c2); cur.pts.push(...bez(last, last, c2, p)); last = p; }
        else if (op === OPS.curveTo3){ const c1 = T(d[k], d[k+1]), p = T(d[k+2], d[k+3]); k += 4; if (!cur) start(c1); cur.pts.push(...bez(last, c1, p, p)); last = p; }
        else if (op === OPS.closePath){ if (cur) cur.closed = true; cur = null; }
        else if (op === OPS.rectangle){ const x = d[k], y = d[k+1], w = d[k+2], h = d[k+3]; k += 4; subs.push({pts:[T(x, y), T(x + w, y), T(x + w, y + h), T(x, y + h)], closed:true}); cur = null; }
      }
      pend = subs;
    }
    else if (fn === OPS.stroke || fn === OPS.closeStroke || fn === OPS.fillStroke || fn === OPS.closeFillStroke || fn === OPS.eoFillStroke || fn === OPS.closeEOFillStroke){ if (fn === OPS.closeStroke || fn === OPS.closeFillStroke || fn === OPS.closeEOFillStroke) pend && pend.forEach(sp => sp.closed = true); emit(); }
    else if (fn === OPS.fill || fn === OPS.eoFill || fn === OPS.endPath || fn === OPS.clip || fn === OPS.eoClip) pend = null;    // filled text/arrows and clips are not geometry
  }
  return out;
}

    <table class="grid"><tr><th></th><th>Colour</th><th>Paths</th></tr>${keys.map(k => `<tr><td><input type="checkbox" data-col="${k}"${W.sel[k] ? ' checked' : ''}></td><td><span style="display:inline-block;width:40px;height:12px;background:rgb(${k});border:1px solid #888;vertical-align:middle"></span> rgb(${k})</td><td>${groups[k].n}</td></tr>`).join('')}</table>
    <fieldset style="margin-top:8px"><legend>Scale</legend><div class="fr"><span>Plot scale (drawing : paper)</span><input type="text" data-k="scale" value="1" style="width:80px"><div class="hint">Title-block scale, e.g. <b>2</b> for 2:1, <b>0.5</b> for 1:2. If unsure leave 1 and use <b>Analyze ▸ Scale check</b> afterwards: click two ends of a known dimension and type its value.</div></div></fieldset>

    const keep = paths.filter(p => W.sel[p.color]).map(p => ({...p, pts:p.pts.map(q => [q[0]*k, q[1]*k])}));

// pull segment end points that lie within tol of each other onto one shared point so chaining can join them
function snapEnds(paths, tol){

  const key = q => Math.round(q[0]/tol) + ',' + Math.round(q[1]/tol), H = new Map();
  ends.forEach(e => { const q = e.p.pts[e.i], k = key(q); (H.get(k) || H.set(k, []).get(k)).push(e); });
  const done = new Set();
  for (const e of ends){
    if (done.has(e)) continue;
    const q = e.p.pts[e.i], gx = Math.round(q[0]/tol), gy = Math.round(q[1]/tol), grp = [];
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (const o of H.get((gx+dx) + ',' + (gy+dy)) || []) if (!done.has(o) && hyp(o.p.pts[o.i][0] - q[0], o.p.pts[o.i][1] - q[1]) <= tol) grp.push(o);
    if (grp.length < 2) continue;
    const cx = grp.reduce((a, o) => a + o.p.pts[o.i][0], 0)/grp.length, cy = grp.reduce((a, o) => a + o.p.pts[o.i][1], 0)/grp.length;
    grp.forEach(o => { o.p.pts[o.i] = [cx, cy]; done.add(o); });
  }
}
// closed polyline that is really a circle (CAD circles arrive as 4 bezier arcs)
function fitCircle(pts){

  let cx = 0, cy = 0; pts.forEach(p => { cx += p[0]; cy += p[1]; }); cx /= pts.length; cy /= pts.length;
  const rs = pts.map(p => hyp(p[0] - cx, p[1] - cy)), r = rs.reduce((a, b) => a + b, 0)/rs.length;
  return rs.every(v => Math.abs(v - r) <= Math.max(r*0.004, isMM() ? 0.01 : 0.0004)) ? [cx, cy, r] : null;
}

function closeGaps(tol, quiet){

// Dynamic Intl costing rules: all-in machine rate, setup counted, 35% margin (price = cost / 0.65), +50% admin on sourced material, PHP.
const EST_DEF = {qty:1, rate:1800, setupMin:45, progMin:30, handlingMin:2, nSetups:1, scrapPct:5, matCost:0, matSourced:true, toolingCost:0, outsideCost:0, packCost:0, contPct:5, marginPct:35, rev:'A', customer:'', rfq:'', notes:''};
function estimate(E){
  const ops = S.ops.filter(o => o.post !== false && o.moves);
  const cycleMin = ops.reduce((a, o) => a + cycleTime(o), 0) + ops.length*0.25;            // + tool changes
  const started = Math.ceil(E.qty*(1 + E.scrapPct/100));
  const lotMin = E.progMin + E.setupMin*E.nSetups + (cycleMin + E.handlingMin)*started;
  const machine = lotMin/60*E.rate;
  const material = E.matCost*(E.matSourced ? 1.5 : 1)*started;
  const oneTime = E.progMin/60*E.rate + E.setupMin*E.nSetups/60*E.rate + E.toolingCost;
  const subtotal = machine + material + E.toolingCost + E.outsideCost + E.packCost;
  const cont = subtotal*E.contPct/100, cost = subtotal + cont;
  const price = cost/(1 - E.marginPct/100);
  return {cycleMin, started, lotMin, machine, material, oneTime, subtotal, cont, cost, price, unit:price/E.qty, perPartCost:cost/E.qty, ops};
}

    let h = esc(t).replace(/```[a-z]*\n?([\s\S]*?)```/g, (_, c) => `<pre style="background:#F4F6FA;border:1px solid #D7DCE4;padding:6px;overflow:auto;font:11px Consolas,monospace;white-space:pre">${c}</pre>`);
    h = h.replace(/^(\|.+\|)\n\|[-:| ]+\|\n((?:\|.+\|\n?)+)/gm, (_, head, body) => { const row = (r, tag) => '<tr>' + r.split('|').slice(1, -1).map(c => `<${tag} style="border:1px solid #D7DCE4;padding:2px 6px">${c.trim()}</${tag}>`).join('') + '</tr>'; return `<table style="border-collapse:collapse;margin:4px 0">${row(head, 'th')}${body.trim().split('\n').map(r => row(r, 'td')).join('')}</table>`; });
    h = h.replace(/^### (.+)$/gm, '<div style="font-weight:bold;margin-top:4px">$1</div>').replace(/^## (.+)$/gm, '<div style="font-weight:bold;font-size:13px;margin-top:6px">$1</div>').replace(/^# (.+)$/gm, '<div style="font-weight:bold;font-size:14px;margin-top:6px">$1</div>');
    h = h.replace(/^(?:[-*•] .+(?:\n|$))+/gm, b => '<ul style="margin:3px 0 3px 18px">' + b.trim().split('\n').map(l => `<li>${l.replace(/^[-*•] /, '')}</li>`).join('') + '</ul>');
    h = h.replace(/^(?:\d+[.)] .+(?:\n|$))+/gm, b => '<ol style="margin:3px 0 3px 18px">' + b.trim().split('\n').map(l => `<li>${l.replace(/^\d+[.)] /, '')}</li>`).join('') + '</ol>');
    return h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n(?!<)/g, '<br>').replace(/(<\/(?:ul|ol|table|pre|div)>)<br>/g, '$1');
  };
  box.innerHTML = AI.msgs.map(m => {
    if (m.role === 'user') return typeof m.content === 'string' ? `<div style="background:#E8F1FB;border-radius:6px;padding:6px 8px;margin:4px 0 4px 30px">${md(m.content)}</div>` : '';
    return m.content.map(b => b.type === 'text' ? `<div style="background:#fff;border:1px solid #D7DCE4;border-radius:6px;padding:6px 8px;margin:4px 30px 4px 0;line-height:1.45">${md(b.text)}</div>` : b.type === 'tool_use' ? `<div class="hint" style="margin-left:4px">⚙ ${esc(b.name)}${b.name === 'create_operation' ? ': ' + esc(b.input.name || b.input.type) : ''}</div>` : '').join('');
  }).join('') || `<div class="hint">Ask like you would ask a senior programmer: "What RPM and feed for a Ø6 carbide end mill in SUS304?", "How do I hold a 3 mm thin plate without it lifting?", "What does G43 H5 do?", "Is 4140 at 50 HRC a milling job?" — or about this job: "Draw a 100 × 60 plate, 10 mm aluminium, with four Ø8 holes 10 mm from each corner and a Ø30 hole in the middle, then program it with the tools in the machine" — or "Program this part: cut the outside, pocket the slot 6 deep, M8 tapped holes" — or "Why is operation 3 warning?"</div>`;
  box.scrollTop = box.scrollHeight;
}
function aiPanel(){
  if (AI.el && document.body.contains(AI.el.closest('.dlg'))){ AI.el.closest('.dlg').style.zIndex = ++zTop; return; }
  const el = document.createElement('div'); el.style.cssText = 'display:flex;flex-direction:column;height:72vh;min-height:360px';
  el.innerHTML = `<div id="aiLog" style="flex:1;overflow:auto;padding:2px"></div><div id="aiSt" class="hint" style="min-height:14px;margin:4px 0"></div>
    <div style="display:flex;gap:6px"><textarea id="aiIn" rows="2" style="flex:1;border:1px solid #8E9AAD;padding:4px;font:inherit;resize:none" placeholder="Ask anything about machining or this job… (Enter to send, Shift+Enter for a new line)"></textarea><button class="btn" id="aiMic" title="Speak (Chrome / Edge)">🎤</button><button class="btn pri" id="aiGo">Send</button></div>
    <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap"><button class="btn" data-q="I will describe a new part for you to draw. First tell me what you need from me: outside size, thickness, material, hole sizes and positions, slots or pockets with depths, and where X0 Y0 should be. Then wait.">Draw a part</button><button class="btn" data-q="Look at this job and tell me, step by step, what operations you would use to machine it and why. Use only the tools loaded in the machine.">Suggest a plan</button><button class="btn" data-q="Check every operation for mistakes a beginner would make (depths, feeds, order, clearances) and fix anything wrong.">Check my program</button><button class="btn" data-q="Explain the posted G-code to me line by line, briefly, like I am new to Fanuc.">Explain the G-code</button><button class="btn" id="aiClr" title="Start a new conversation">New chat</button><button class="btn" id="aiKey">API key…</button><label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="aiSpk"> Read replies aloud</label></div>`;
  AI.el = el;
  dlg({title:'✦ Claude — CAM assistant', body:el, w:600, modal:false, footer:false, x:innerWidth - 620, y:70});
  const send = () => { const i = el.querySelector('#aiIn'), t = i.value.trim(); if (!t) return; i.value = ''; aiSend(t); };
  el.querySelector('#aiGo').onclick = send;
  el.querySelector('#aiIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
  el.querySelector('#aiClr').onclick = () => { AI.msgs = []; aiRender(); aiSave(); };
  el.querySelector('#aiKey').onclick = aiSettings;
  el.querySelectorAll('[data-q]').forEach(b => b.onclick = () => aiSend(b.dataset.q));
  // voice input (Web Speech API — Chrome / Edge) and spoken replies
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = el.querySelector('#aiMic');
  if (!SR){ mic.disabled = true; mic.title = 'Voice input needs Chrome or Edge'; }
  else mic.onclick = () => {
    if (AI.rec){ AI.rec.stop(); return; }
    const r = new SR(); r.lang = navigator.language || 'en-US'; r.interimResults = true; r.continuous = false;
    const i = el.querySelector('#aiIn'); AI.rec = r; mic.classList.add('on'); mic.textContent = '⏺'; aiStatus('Listening… click 🎤 again to stop');
    r.onresult = e => { let t = ''; for (const res of e.results) t += res[0].transcript; i.value = t; if (e.results[e.results.length-1].isFinal){ r.stop(); } };
    r.onerror = e => aiStatus(e.error === 'not-allowed' ? 'Microphone blocked — allow it in the browser address bar.' : 'Voice: ' + e.error);
    r.onend = () => { AI.rec = null; mic.classList.remove('on'); mic.textContent = '🎤'; if (i.value.trim()){ aiStatus(''); send(); } };
    r.start();
  };
  AI.speak = el.querySelector('#aiSpk');
  aiRender();
  if (!AI.key) AI.sampleP.then(s => { if (!s) aiSettings(); else aiStatus('No API key needed here: Claude answers on your own Claude account.'); });
}
