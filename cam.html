<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
const CL = window.ClipperLib;

/* ============================== utilities ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const rnd = v => +(+v).toFixed(4);
const hyp = Math.hypot;
const tick = () => new Promise(r => setTimeout(r, 0));
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function status(t){ $('#status').textContent = t || ''; }
function busy(on, t){ $('#busy').style.display = on ? 'flex' : 'none'; if (t) $('#busy').textContent = t; }

/* ============================== state ============================== */
const MATS = {
  alu:{n:'Aluminum 6061/7075', vc:300, fz:0.010},
  mild:{n:'Mild steel 1018/1045', vc:120, fz:0.006},
  alloy:{n:'Alloy / tool steel P20, 4140', vc:90, fz:0.005},
  ss:{n:'Stainless 304/316', vc:80, fz:0.004},
  ci:{n:'Cast iron', vc:100, fz:0.007},
  brass:{n:'Brass / bronze', vc:200, fz:0.008},
  plastic:{n:'Plastics (POM, nylon)', vc:250, fz:0.012}
};
const TOOL_TYPES = [['flat','Flat end mill'],['bull','Bull nose end mill'],['ball','Ball end mill'],['face','Face mill'],['drill','Drill'],['spot','Spot / center drill'],['tap','Tap'],['ream','Reamer / boring bar']];
const MILLS = ['flat','bull','ball','face'];

function defTools(u){
  const T = (num,name,type,dia,o={}) => Object.assign({id:uid(),num,name,type,dia,cr:0,flutes:3,len:u==='mm'?30:1.25,rpm:3000,feed:u==='mm'?600:24,plunge:u==='mm'?200:8,pitch:0,angle:118}, o);
  if (u === 'mm') return [
    T(1,'Ø50 Face mill 5FL','face',50,{flutes:5,len:40,rpm:1500,feed:900,plunge:300}),
    T(2,'Ø10 Flat end mill 3FL','flat',10,{rpm:4500,feed:900,plunge:250}),
    T(3,'Ø6 Flat end mill 3FL','flat',6,{len:20,rpm:7000,feed:800,plunge:200}),
    T(4,'Ø6 Ball end mill 2FL','ball',6,{flutes:2,len:20,rpm:8000,feed:1400,plunge:300}),
    T(5,'Ø8 Spot drill 90°','spot',8,{flutes:2,angle:90,rpm:2500,feed:200,plunge:200}),
    T(6,'Ø6.8 Drill (M8 tap)','drill',6.8,{flutes:2,len:45,rpm:2200,feed:250,plunge:250}),
    T(7,'M8×1.25 Tap','tap',8,{flutes:3,len:25,rpm:400,feed:500,plunge:500,pitch:1.25})
  ];
  return [
    T(1,'2" Face mill 5FL','face',2,{flutes:5,len:1.5,rpm:1500,feed:35,plunge:12}),
    T(2,'1/2" Flat end mill 3FL','flat',0.5,{rpm:3600,feed:36,plunge:10}),
    T(3,'1/4" Flat end mill 3FL','flat',0.25,{len:0.75,rpm:7000,feed:32,plunge:8}),
    T(4,'1/4" Ball end mill 2FL','ball',0.25,{flutes:2,len:0.75,rpm:8000,feed:55,plunge:12}),
    T(5,'3/8" Spot drill 90°','spot',0.375,{flutes:2,angle:90,rpm:2500,feed:8,plunge:8}),
    T(6,'#7 Drill (1/4-20 tap)','drill',0.201,{flutes:2,len:1.75,rpm:2200,feed:10,plunge:10}),
    T(7,'1/4-20 Tap','tap',0.25,{flutes:3,len:1,rpm:400,feed:20,plunge:20,pitch:0.05})
  ];
}
function defSetup(u){
  const k = u === 'mm' ? 1 : 1/25.4;
  return {units:u, progNum:1001, progName:'PART', wcs:'G54', safeZ:rnd(50*k), clearZ:rnd(5*k),
    stock:{auto:true, margin:rnd(2*k), x0:0, y0:0, x1:rnd(100*k), y1:rnd(100*k), top:0, bottom:rnd(-20*k)},
    maxRpm:8000, maxFeed:rnd(10000*k), rapid:rnd(15000*k), material:'alu',
    post:{lineNums:true, nInc:10, coolant:'M08', home:'G91 G28 Z0.', endY:true, m01:true, nextTool:false, tcFmt:'T# M06', rigid:true, arcs:true}};
}
const S = {setup:defSetup('mm'), tools:defTools('mm'), ops:[], geom:{items:[], layers:{}, chains:[], mesh:null, name:''}};
let activeOp = null, gcode = [], simPts = [], tab = 'ops';

/* ============================== DXF parsing ============================== */
function arcPts(cx, cy, r, a0, a1, tol){
  const sweep = a1 - a0;
  const step = r > tol ? 2*Math.acos(Math.max(-1, 1 - tol/r)) : Math.PI/4;
  const n = Math.max(2, Math.ceil(Math.abs(sweep)/Math.min(step, Math.PI/18)));
  const out = [];
  for (let i = 0; i <= n; i++){ const a = a0 + sweep*i/n; out.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]); }
  return out;
}
function bulgePts(p, q, b, tol){
  if (Math.abs(b) < 1e-9) return [p, q];
  const th = 4*Math.atan(b), c = hyp(q[0]-p[0], q[1]-p[1]);
  if (c < 1e-12) return [p, q];
  const r = c/(2*Math.sin(Math.abs(th)/2));
  const mx = (p[0]+q[0])/2, my = (p[1]+q[1])/2;
  const h = (c/2)/Math.tan(th/2);                   // signed distance from chord midpoint to centre (left of p→q)
  const cx = mx - (q[1]-p[1])/c*h, cy = my + (q[0]-p[0])/c*h;
  const a0 = Math.atan2(p[1]-cy, p[0]-cx);
  const pts = arcPts(cx, cy, r, a0, a0 + th, tol);
  pts[0] = p; pts[pts.length-1] = q;
  return pts;
}
function bspline(deg, knots, ctrl, w, n){
  const out = [], k0 = knots[deg], k1 = knots[knots.length-1-deg];
  for (let s = 0; s <= n; s++){
    let t = k0 + (k1-k0)*s/n; if (s === n) t = k1 - 1e-10;
    let span = deg; while (span < ctrl.length-1 && knots[span+1] <= t) span++;
    const d = []; for (let j = 0; j <= deg; j++){ const c = ctrl[span-deg+j], ww = w ? w[span-deg+j] : 1; d.push([c[0]*ww, c[1]*ww, ww]); }
    for (let r = 1; r <= deg; r++) for (let j = deg; j >= r; j--){
      const i = span-deg+j, den = knots[i+deg-r+1] - knots[i], a = den ? (t-knots[i])/den : 0;
      d[j] = [(1-a)*d[j-1][0]+a*d[j][0], (1-a)*d[j-1][1]+a*d[j][1], (1-a)*d[j-1][2]+a*d[j][2]];
    }
    out.push([d[deg][0]/d[deg][2], d[deg][1]/d[deg][2]]);
  }
  return out;
}
function parseDXF(text){
  const L = text.split(/\r?\n/), P = [];
  for (let i = 0; i + 1 < L.length; i += 2) P.push([parseInt(L[i]), L[i+1].trim()]);
  let units = 0, sec = null, i = 0;
  const blocks = {}, ents = [];
  let curBlock = null;
  // gather raw entities
  while (i < P.length){
    const [c, v] = P[i];
    if (c === 0 && v === 'SECTION'){ sec = P[i+1] && P[i+1][1]; i += 2; continue; }
    if (c === 0 && v === 'ENDSEC'){ sec = null; i++; continue; }
    if (sec === 'HEADER' && c === 9 && v === '$INSUNITS'){ units = parseInt(P[i+1][1]); i += 2; continue; }
    if ((sec === 'ENTITIES' || sec === 'BLOCKS') && c === 0){
      const e = {type:v, g:[]}; i++;
      while (i < P.length && P[i][0] !== 0){ e.g.push(P[i]); i++; }
      if (v === 'BLOCK'){ curBlock = {name:gv(e,2), bx:+gv(e,10,0), by:+gv(e,20,0), ents:[]}; blocks[curBlock.name] = curBlock; continue; }
      if (v === 'ENDBLK'){ curBlock = null; continue; }
      if (+gv(e,67,0) === 1) continue;                         // paper space
      (curBlock ? curBlock.ents : ents).push(e);
      continue;
    }
    i++;
  }
  // attach VERTEX entities to their POLYLINE
  const fold = list => { const out = []; let pl = null;
    for (const e of list){
      if (e.type === 'POLYLINE'){ pl = e; e.verts = []; out.push(e); }
      else if (e.type === 'VERTEX' && pl) pl.verts.push(e);
      else if (e.type === 'SEQEND') pl = null;
      else out.push(e);
    } return out; };
  for (const b of Object.values(blocks)) b.ents = fold(b.ents);
  return {units, ents:fold(ents), blocks};
}
function gv(e, code, d){ const p = e.g.find(x => x[0] === code); return p ? p[1] : d; }
function gall(e, code){ return e.g.filter(x => x[0] === code).map(x => +x[1]); }
function dxfItems(dxf, tol){
  const items = [];
  const emit = (it, layer, X) => {
    it.layer = layer;
    if (it.kind === 'circle'){
      const c = X.p([it.cx, it.cy]);
      if (X.uniform){ items.push({kind:'circle', cx:c[0], cy:c[1], r:it.r*X.s, layer}); return; }
      it = {kind:'poly', closed:true, pts:arcPts(it.cx, it.cy, it.r, 0, 2*Math.PI, tol).slice(0,-1), layer};
    }
    if (it.kind === 'point'){ const c = X.p([it.x, it.y]); items.push({kind:'point', x:c[0], y:c[1], layer}); return; }
    items.push({kind:'poly', closed:it.closed, pts:it.pts.map(X.p), layer});
  };
  const walk = (ents, X, depth) => {
    for (const e of ents){
      const layer = gv(e, 8, '0');
      const t = e.type;
      if (t === 'LINE') emit({kind:'poly', pts:[[+gv(e,10,0), +gv(e,20,0)], [+gv(e,11,0), +gv(e,21,0)]]}, layer, X);
      else if (t === 'CIRCLE') emit({kind:'circle', cx:+gv(e,10,0), cy:+gv(e,20,0), r:+gv(e,40,0)}, layer, X);
      else if (t === 'ARC'){
        const a0 = +gv(e,50,0)*Math.PI/180; let a1 = +gv(e,51,0)*Math.PI/180; if (a1 <= a0) a1 += 2*Math.PI;
        emit({kind:'poly', pts:arcPts(+gv(e,10,0), +gv(e,20,0), +gv(e,40,0), a0, a1, tol)}, layer, X);
      }
      else if (t === 'LWPOLYLINE' || t === 'POLYLINE'){
        let V = [];
        if (t === 'LWPOLYLINE'){ let cur = null; for (const [c, v] of e.g){ if (c === 10){ cur = {x:+v, y:0, b:0}; V.push(cur); } else if (c === 20 && cur) cur.y = +v; else if (c === 42 && cur) cur.b = +v; } }
        else { if (+gv(e,70,0) & (16|64)) continue; V = e.verts.map(v => ({x:+gv(v,10,0), y:+gv(v,20,0), b:+gv(v,42,0)})); }
        const closed = !!(+gv(e,70,0) & 1);
        if (V.length < 2) continue;
        const pts = [[V[0].x, V[0].y]];
        const n = closed ? V.length : V.length - 1;
        for (let k = 0; k < n; k++){ const a = V[k], b = V[(k+1) % V.length]; pts.push(...bulgePts([a.x,a.y], [b.x,b.y], a.b, tol).slice(1)); }
        if (closed) pts.pop();
        emit({kind:'poly', closed, pts}, layer, X);
      }
      else if (t === 'SPLINE'){
        const deg = +gv(e,71,3), knots = gall(e,40), cx = gall(e,10), cy = gall(e,20), w = gall(e,41), fx = gall(e,11), fy = gall(e,21);
        let pts;
        if (cx.length > deg && knots.length === cx.length + deg + 1){
          const ctrl = cx.map((x, k) => [x, cy[k]]);
          pts = bspline(deg, knots, ctrl, w.length === ctrl.length ? w : null, Math.max(64, ctrl.length*16));
        } else if (fx.length > 1) pts = fx.map((x, k) => [x, fy[k]]);
        else continue;
        emit({kind:'poly', closed:!!(+gv(e,70,0) & 1), pts}, layer, X);
      }
      else if (t === 'ELLIPSE'){
        const cx = +gv(e,10,0), cy = +gv(e,20,0), mx = +gv(e,11,0), my = +gv(e,21,0), ra = +gv(e,40,1);
        let s = +gv(e,41,0), en = +gv(e,42,2*Math.PI); if (en <= s) en += 2*Math.PI;
        const a = hyp(mx, my), rot = Math.atan2(my, mx), b = a*ra;
        const n = Math.max(32, Math.ceil((en-s)/(2*Math.acos(Math.max(-1, 1 - tol/a)))));
        const pts = []; for (let k = 0; k <= n; k++){ const tt = s + (en-s)*k/n, x = a*Math.cos(tt), y = b*Math.sin(tt); pts.push([cx + x*Math.cos(rot) - y*Math.sin(rot), cy + x*Math.sin(rot) + y*Math.cos(rot)]); }
        const full = Math.abs(en - s - 2*Math.PI) < 1e-6;

/* ============================== chaining ============================== */
function buildChains(items, layers){
  const tol = S.setup.units === 'mm' ? 0.01 : 0.0004;
  const out = [], open = [];
  let id = 1;
  for (const it of items){
    if (layers[it.layer] === false) continue;
    if (it.kind === 'circle') out.push({id:id++, closed:true, circle:{cx:it.cx, cy:it.cy, r:it.r}, pts:arcPts(it.cx, it.cy, it.r, 0, 2*Math.PI, chordTol()).slice(0,-1), layer:it.layer});
    else if (it.kind === 'point') out.push({id:id++, point:true, closed:false, pts:[[it.x, it.y]], layer:it.layer});
    else if (it.closed) out.push({id:id++, closed:true, pts:it.pts.slice(), layer:it.layer});
    else open.push({pts:it.pts.slice(), used:false, layer:it.layer});
  }
  // spatial hash on open-segment endpoints
  const key = p => Math.round(p[0]/tol) + ',' + Math.round(p[1]/tol);
  const H = new Map();
  const put = (p, s) => { const k = key(p); if (!H.has(k)) H.set(k, []); H.get(k).push(s); };
  open.forEach(s => { put(s.pts[0], s); put(s.pts[s.pts.length-1], s); });
  const find = p => {
    const gx = Math.round(p[0]/tol), gy = Math.round(p[1]/tol);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++){
      const l = H.get((gx+dx) + ',' + (gy+dy)); if (!l) continue;
      for (const s of l){ if (s.used) continue;
        const a = s.pts[0], b = s.pts[s.pts.length-1];
        if (hyp(a[0]-p[0], a[1]-p[1]) <= tol) return [s, false];
        if (hyp(b[0]-p[0], b[1]-p[1]) <= tol) return [s, true];
      }
    }
    return null;
  };
  for (const s of open){
    if (s.used) continue;
    s.used = true;
    let pts = s.pts.slice(), f;
    while ((f = find(pts[pts.length-1]))){ f[0].used = true; const q = f[1] ? f[0].pts.slice().reverse() : f[0].pts; pts.push(...q.slice(1)); }
    while ((f = find(pts[0]))){ f[0].used = true; const q = f[1] ? f[0].pts : f[0].pts.slice().reverse(); pts = q.slice(0, -1).concat(pts); }
    const a = pts[0], b = pts[pts.length-1];
    const closed = pts.length > 2 && hyp(a[0]-b[0], a[1]-b[1]) <= tol;
    if (closed) pts.pop();
    out.push({id:id++, closed, pts, layer:s.layer});

}
function chordTol(){ return S.setup.units === 'mm' ? 0.002 : 0.0001; }
function area(pts){ let a = 0; for (let i = 0, n = pts.length; i < n; i++){ const p = pts[i], q = pts[(i+1)%n]; a += p[0]*q[1] - q[0]*p[1]; } return a/2; }

/* ============================== geometry placement ============================== */
function geomBBox(){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const c of S.geom.chains) for (const p of c.pts){ x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  const m = S.geom.mesh;
  if (m){ x0 = Math.min(x0, m.bb[0]); y0 = Math.min(y0, m.bb[1]); z0 = m.bb[2]; x1 = Math.max(x1, m.bb[3]); y1 = Math.max(y1, m.bb[4]); z1 = m.bb[5]; }

}
function meshBB(pos){

}

}
function translateGeom(dx, dy){

  if (S.geom.mesh){ const p = S.geom.mesh.pos; for (let i = 0; i < p.length; i += 3){ p[i] += dx; p[i+1] += dy; } S.geom.mesh.bb = meshBB(p); }

}
function rotateMesh(axis){
  const m = S.geom.mesh; if (!m) return;
  const p = m.pos;

    const x = p[i], y = p[i+1], z = p[i+2];
    if (axis === 'x'){ p[i+1] = -z; p[i+2] = y; } else if (axis === 'y'){ p[i] = z; p[i+2] = -x; } else { p[i] = -y; p[i+1] = x; }

}
function scaleGeom(f){
  for (const it of S.geom.items){ if (it.kind === 'circle'){ it.cx *= f; it.cy *= f; it.r *= f; } else if (it.kind === 'point'){ it.x *= f; it.y *= f; } else it.pts.forEach(p => { p[0] *= f; p[1] *= f; }); }

  rebuildChains(true);
}
function rebuildChains(keepSel){
  const old = S.geom.chains;
  S.geom.chains = buildChains(S.geom.items, S.geom.layers);

const SC = () => S.setup.units === 'mm' ? 1e4 : 1e5;
const toCL = pl => pl.map(pts => pts.map(p => ({X:Math.round(p[0]*SC()), Y:Math.round(p[1]*SC())})));
const fromCL = pl => pl.map(path => path.map(p => [p.X/SC(), p.Y/SC()]));

  c.Execute(CL.ClipType.ctUnion, sol, CL.PolyFillType.pftEvenOdd, CL.PolyFillType.pftEvenOdd);

}

/* ============================== path builder ============================== */
class PB {
  constructor(ctx){ this.m = []; this.c = ctx; this.cur = null; }
  add(g, x, y, z, f, ex){ this.m.push(Object.assign({g, x, y, z, f}, ex || {})); this.cur = {x, y, z}; }
  rapid(x, y, z){ const c = this.cur; if (c && Math.abs(c.x-x) < 1e-9 && Math.abs(c.y-y) < 1e-9 && Math.abs(c.z-z) < 1e-9) return; this.add(0, x, y, z); }
  feed(x, y, z, f){ const c = this.cur; if (c && Math.abs(c.x-x) < 1e-9 && Math.abs(c.y-y) < 1e-9 && Math.abs(c.z-z) < 1e-9) return; this.add(1, x, y, z, f || this.c.feed); }
  // travel to (x,y) and enter down to z: rapid to approach height, then feed
  enter(x, y, z, approach){
    const cz = this.c.clearZ;
    if (!this.cur) this.add(0, x, y, this.c.safeZ);
    else if (hyp(this.cur.x-x, this.cur.y-y) > 1e-9){ this.rapid(this.cur.x, this.cur.y, Math.max(cz, this.cur.z)); this.rapid(x, y, cz); }
    const a = Math.min(cz, approach == null ? cz : approach);
    if (a > z) { this.rapid(x, y, Math.max(a, z)); }
    this.feed(x, y, z, this.c.plunge);
  }
  retract(){ if (this.cur) this.rapid(this.cur.x, this.cur.y, Math.max(this.c.clearZ, this.cur.z)); }
  end(){ if (this.cur) this.rapid(this.cur.x, this.cur.y, this.c.safeZ); }

  // Points are [x,y] at height z, or [x,y,z] for ramps (z linear in length → helical arcs).
  poly(pts, z, f){
    f = f || this.c.feed;
    const Z = p => p.length > 2 ? p[2] : z;
    if (!S.setup.post.arcs || pts.length < 3){ for (const p of pts) this.feed(p[0], p[1], Z(p), f); return; }
    const all = [[this.cur.x, this.cur.y, this.cur.z]].concat(pts);
    for (const s of arcFit(all, arcTol())){
      const zz = Z(all[s.k]);
      if (s.arc) this.add(s.cw ? 2 : 3, s.x, s.y, zz, f, {i:s.cx - this.cur.x, j:s.cy - this.cur.y});
      else this.feed(s.x, s.y, zz, f);

}
const arcTol = () => S.setup.units === 'mm' ? 0.005 : 0.0002;
function circ3(a, b, c){
  const d = 2*(a[0]*(b[1]-c[1]) + b[0]*(c[1]-a[1]) + c[0]*(a[1]-b[1]));

}
// greedy arc fitting of a polyline; returns segments ending at each target point
function arcFit(pts, tol){
  const out = [], n = pts.length, maxR = S.setup.units === 'mm' ? 2000 : 80;
  let i = 0;
  while (i < n - 1){
    let best = null;
    for (let j = i + 3; j < n; j++){
      const c = circ3(pts[i], pts[(i+j) >> 1], pts[j]);
      if (!c || c[2] > maxR) break;
      let ok = true, sgn = 0, sweep = 0;
      for (let k = i; k < j && ok; k++){
        const p = pts[k], q = pts[k+1];
        if (Math.abs(hyp(q[0]-c[0], q[1]-c[1]) - c[2]) > tol) ok = false;
        const cr = (p[0]-c[0])*(q[1]-c[1]) - (p[1]-c[1])*(q[0]-c[0]);
        const s = Math.sign(cr); if (!s || (sgn && s !== sgn)) ok = false; sgn = s;
        sweep += Math.abs(Math.atan2(cr, (p[0]-c[0])*(q[0]-c[0]) + (p[1]-c[1])*(q[1]-c[1])));

        if (c[2] - hyp(mx-c[0], my-c[1]) > tol*2) ok = false;
      }
      if (!ok || sweep > Math.PI) break;
      best = {j, c, cw:sgn < 0};
    }
    if (best){ out.push({arc:true, k:best.j, x:pts[best.j][0], y:pts[best.j][1], cx:best.c[0], cy:best.c[1], cw:best.cw}); i = best.j; }
    else { out.push({k:i+1, x:pts[i+1][0], y:pts[i+1][1]}); i++; }
  }

  }

  const p = op.p;

      const a = ring[k % ring.length], b = ring[(k+1) % ring.length], L = hyp(b[0]-a[0], b[1]-a[1]);

}

/* ============================== simulation path ============================== */
function expand(){
  const pts = [];
  S.ops.filter(o => o.enabled && o.moves && o.moves.length).forEach(op => {
    const t = toolOf(op);
    let c = null;
    const P = (x, y, z, rapid, line) => { pts.push({x, y, z, rapid, line, op, t}); c = {x, y, z}; };
    for (const m of op.moves){
      if (m.g === 'cyc'){
        const z0 = c.z;
        m.pts.forEach((q, qi) => { const ln = m.lines ? m.lines[qi] : null; P(q[0], q[1], z0, true, ln); P(q[0], q[1], m.r, true, ln); P(q[0], q[1], m.zb, false, ln); P(q[0], q[1], m.r, m.code !== 'G84' && m.code !== 'G85', ln); P(q[0], q[1], z0, true, ln); });
        continue;
      }
      if ((m.g === 2 || m.g === 3) && c){
        const cx = c.x + m.i, cy = c.y + m.j, rr = hyp(m.i, m.j);
        let a0 = Math.atan2(c.y - cy, c.x - cx), a1 = Math.atan2(m.y - cy, m.x - cx);
        if (m.g === 3 && a1 <= a0) a1 += 2*Math.PI; if (m.g === 2 && a1 >= a0) a1 -= 2*Math.PI;
        const n = Math.max(2, Math.ceil(Math.abs(a1 - a0)/0.1)), z0 = c.z;
        for (let k = 1; k <= n; k++){ const a = a0 + (a1 - a0)*k/n; P(cx + rr*Math.cos(a), cy + rr*Math.sin(a), z0 + (m.z - z0)*k/n, false, m.line); }
        continue;
      }
      P(m.x, m.y, m.z, m.g === 0, m.line);
    }
  });
  return pts;
}
function cycleTime(op){
  const t = toolOf(op), st = S.setup; let tm = 0, c = null;
  for (const m of op.moves || []){
    if (m.g === 'cyc'){ m.pts.forEach(() => { tm += 2*Math.abs(m.r - m.zb)/m.f; }); if (m.pts.length > 1) for (let k = 1; k < m.pts.length; k++) tm += hyp(m.pts[k][0]-m.pts[k-1][0], m.pts[k][1]-m.pts[k-1][1])/st.rapid; c = {x:m.x, y:m.y, z:m.z}; continue; }
    if (c){ let d = hyp(m.x-c.x, m.y-c.y, m.z-c.z); if (m.g >= 2){ const rr = hyp(m.i, m.j); d = Math.max(d, rr*0.5); } tm += d/(m.g === 0 ? st.rapid : (m.f || t.feed)); }
    c = m;
  }
  return tm;   // minutes
}

/* ============================== stock verification ============================== */
function clearSim(){ clearG(G.sim); }
async function verify(){
  if (!simPts.length) return;
  const s = S.setup.stock, upto = +$('#slider').value;
  const span = Math.max(s.x1 - s.x0, s.y1 - s.y0);
  const res = Math.max(span/450, S.setup.units === 'mm' ? 0.05 : 0.002);
  const nx = Math.ceil((s.x1 - s.x0)/res) + 1, ny = Math.ceil((s.y1 - s.y0)/res) + 1;
  const h = new Float32Array(nx*ny).fill(s.top);
  const fps = new Map(), hits = [];
  busy(true, 'Verifying…'); await tick();
  for (let k = 1; k <= upto; k++){
    const a = simPts[k-1], b = simPts[k];
    if (a.op !== b.op) continue;
    const t = b.t;
    let fp = fps.get(t); if (!fp){ fp = footprint(t.dia/2, res, t.type === 'ball' ? 'ball' : t.type === 'bull' ? 'bull' : 'flat', t.type === 'ball' ? t.dia/2 : t.cr || 0); fps.set(t, fp); }
    const L = hyp(b.x - a.x, b.y - a.y, b.z - a.z), n = Math.max(1, Math.ceil(L/(res*0.7)));
    if (Math.min(a.z, b.z) > s.top) continue;
    for (let q = 1; q <= n; q++){
      const x = a.x + (b.x - a.x)*q/n, y = a.y + (b.y - a.y)*q/n, z = a.z + (b.z - a.z)*q/n;
      if (z >= s.top) continue;
      const ci = Math.round((x - s.x0)/res), cj = Math.round((y - s.y0)/res);
      let hit = false;
      for (let m = 0; m < fp.di.length; m++){
        const ii = ci + fp.di[m], jj = cj + fp.dj[m];
        if (ii < 0 || jj < 0 || ii >= nx || jj >= ny) continue;
        const idx = jj*nx + ii, zz = z + fp.dr[m];
        if (h[idx] > zz + 1e-6){ if (b.rapid && h[idx] - zz > res*0.5) hit = true; h[idx] = zz; }
      }
      if (hit && hits.length < 50) hits.push({x, y, z, line:b.line, op:b.op.name});
    }
    if (k % 3000 === 0){ busy(true, `Verifying… ${Math.round(100*k/upto)}%`); await tick(); }
  }
  // mesh of the remaining stock
  clearSim();
  const pos = new Float32Array(nx*ny*3), idx = [];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++){ const k = j*nx + i; pos[k*3] = s.x0 + i*res; pos[k*3+1] = s.y0 + j*res; pos[k*3+2] = Math.max(h[k], s.bottom); }
  for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++){ const a = j*nx + i; idx.push(a, a+1, a+nx, a+1, a+nx+1, a+nx); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  G.sim.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:0x81C784, roughness:0.55, metalness:0.15, side:THREE.DoubleSide})));
  busy(false);
  const wl = $('#warn');
  wl.querySelectorAll('.e').forEach(d => d.remove());
  if (hits.length) hits.slice(0, 10).forEach(hh => { const d = document.createElement('div'); d.className = 'e'; d.textContent = `⚠ RAPID INTO MATERIAL — ${hh.op} near X${fmt(hh.x)} Y${fmt(hh.y)} Z${fmt(hh.z)}${hh.line != null ? ` (line ${hh.line + 1})` : ''}`; wl.prepend(d); });
  status(hits.length ? `Verify found ${hits.length} rapid move(s) cutting material — see warnings.` : `Verify OK up to move ${upto}: no rapid moves cut material.`);
}

/* ============================== regenerate ============================== */
let timer = null, running = false, again = false;

async function regen(){
  if (running){ again = true; return; }
  running = true;
  try {
    for (const op of S.ops) if (op.enabled && !op.moves){
      busy(true, `${op.name}…`); await tick();
      try { await genOp(op); } catch(e){ op.moves = []; op.warn = ['Error: ' + e.message]; console.error(e); }
    }

    const sl = $('#slider'); sl.max = Math.max(0, simPts.length - 1); sl.value = sl.max;

function autoSelHoles(op, force){ if (force || !op.sel.length) op.sel = S.geom.chains.filter(c => c.circle || c.point).map(c => c.id); }
function calcSpeeds(t){
  const m = MATS[S.setup.material], inch = S.setup.units === 'in', D = inch ? t.dia*25.4 : t.dia;
  if (!(D > 0)) return;
  let vc = m.vc, rpm, feed;
  if (t.type === 'drill' || t.type === 'spot'){ vc *= 0.35; rpm = vc*1000/(Math.PI*D); feed = rpm*m.fz*D*2.5; }
  else if (t.type === 'tap'){ vc *= 0.06; rpm = vc*1000/(Math.PI*D); feed = rpm*(inch ? t.pitch*25.4 : t.pitch); }
  else if (t.type === 'ream'){ vc *= 0.25; rpm = vc*1000/(Math.PI*D); feed = rpm*m.fz*D*4; }
  else { if (t.type === 'face') vc *= 0.8; rpm = vc*1000/(Math.PI*D); rpm = Math.min(rpm, S.setup.maxRpm); feed = rpm*t.flutes*m.fz*Math.max(0.3, Math.min(2, D/10)); }
  rpm = Math.min(rpm, S.setup.maxRpm);
  if (t.type === 'drill' || t.type === 'spot') feed = rpm*m.fz*D*2.5;
  if (t.type === 'tap') feed = rpm*(inch ? t.pitch*25.4 : t.pitch);
  t.rpm = Math.round(rpm/10)*10;
  const k = inch ? 1/25.4 : 1;
  t.feed = rnd(Math.round(feed*k*(inch ? 10 : 0.1))/(inch ? 10 : 0.1));
  t.plunge = MILLS.includes(t.type) ? rnd(t.feed*0.3) : t.feed;
  status(`T${t.num}: ${t.rpm} RPM, F${t.feed} for ${m.n}`);
}

const OCCT = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.22/dist/';
let occtP = null;
function loadOCCT(){
  if (!occtP) occtP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = OCCT + 'occt-import-js.js'; s.onload = () => window.occtimportjs({locateFile:f => OCCT + f}).then(res, rej); s.onerror = () => rej(new Error('Could not load the STEP/IGES reader (needs internet).')); document.head.appendChild(s); });
  return occtP;
}
async function openFile(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'dwg'){ alert('DWG is a closed AutoCAD format that browsers cannot read.\n\nIn AutoCAD/DraftSight use "Save As → DXF", or convert with the free ODA File Converter, then open the DXF here.'); return; }
  if (ext === 'pdf'){ alert('A PDF drawing has no machinable geometry.\n\nAsk the customer for DXF or STEP. If the PDF is vector (made from CAD), AutoCAD (PDFIMPORT) or Inkscape can convert it to DXF — then check the scale against a known dimension.'); return; }
  if (S.geom.chains.length || S.geom.mesh){ if (!confirm(`Open ${file.name}? It replaces the current drawing/model (operations and tools are kept).`)) return; }
  busy(true, 'Reading ' + file.name + '…'); await tick();
  try {
    S.geom.items = []; S.geom.layers = {}; S.geom.chains = []; S.geom.mesh = null;
    S.ops.forEach(o => o.sel = []);
    if (ext === 'dxf'){
      const dxf = parseDXF(await file.text());
      const items = dxfItems(dxf, chordTol());
      const fu = {1:'in', 4:'mm', 5:'cm', 6:'m', 2:'ft'}[dxf.units];
      const toMM = {in:25.4, mm:1, cm:10, m:1000, ft:304.8}[fu];
      const f = toMM ? toMM/(S.setup.units === 'mm' ? 1 : 25.4) : 1;
      S.geom.items = items; S.geom.layers = {};
      items.forEach(it => S.geom.layers[it.layer] = true);
      if (f !== 1) for (const it of items){ if (it.kind === 'circle'){ it.cx *= f; it.cy *= f; it.r *= f; } else if (it.kind === 'point'){ it.x *= f; it.y *= f; } else it.pts.forEach(p => { p[0] *= f; p[1] *= f; }); }
      S.geom.name = file.name;
      S.geom.chains = buildChains(items, S.geom.layers);
      S.ops.forEach(o => { if (OPDEF[o.type].chains) o.sel = []; });
      status(`${file.name}: ${S.geom.chains.length} chains${fu ? ` (drawing units: ${fu})` : ' (no units in file — assumed ' + S.setup.units + ')'}. Untick unwanted layers in Setup.`);
    } else if (ext === 'stl'){
      const g = new STLLoader().parse(await file.arrayBuffer());
      setMesh(new Float32Array(g.attributes.position.array));
      S.geom.name = file.name;
      status(`${file.name}: ${(S.geom.mesh.pos.length/9) | 0} triangles. STL has no units — use Scale in Setup if the size is wrong.`);
    } else if (['step', 'stp', 'iges', 'igs'].includes(ext)){
      busy(true, 'Loading STEP/IGES reader…');
      const occt = await loadOCCT();
      busy(true, 'Meshing ' + file.name + '…'); await tick();
      const buf = new Uint8Array(await file.arrayBuffer());
      const prm = {linearUnit:S.setup.units === 'mm' ? 'millimeter' : 'inch', linearDeflectionType:'absolute_value', linearDeflection:S.setup.units === 'mm' ? 0.01 : 0.0004, angularDeflection:0.1};
      const r = ext.startsWith('st') ? occt.ReadStepFile(buf, prm) : occt.ReadIgesFile(buf, prm);
      if (!r.success || !r.meshes.length) throw new Error('Could not read the model.');
      const out = [];
      for (const m of r.meshes){ const p = m.attributes.position.array, ix = m.index ? m.index.array : null;
        if (ix) for (const k of ix) out.push(p[k*3], p[k*3+1], p[k*3+2]); else out.push(...p); }
      setMesh(new Float32Array(out));
      S.geom.name = file.name;
      status(`${file.name}: ${r.meshes.length} bodies, ${(out.length/9) | 0} triangles. Top of part placed at Z0 — rotate in Setup if needed.`);
    } else { alert('Unsupported file type: .' + ext); return; }
    afterGeom(); setView('iso'); renderPanel();
  } catch(e){ console.error(e); alert('Could not open ' + file.name + ':\n' + e.message); }
  finally { busy(false); }
}

  const face = defOp('face'); face.p.top = S.setup.stock.top; face.p.bottom = 0;
  const pk = defOp('pocket'); pk.toolId = (S.tools.find(t => t.type === 'flat' && t.dia < 8*u) || T('flat')).id; pk.sel = byL('POCKET').map(c => c.id); pk.p.bottom = rnd(-6*u);
  const sp = defOp('drill'); sp.name = 'Spot drill'; sp.toolId = T('spot').id; sp.p.cycle = 'G82'; sp.p.bottom = rnd(-1.5*u); sp.p.dwell = 200; sp.p.addTip = false; sp.sel = byL('HOLES').map(c => c.id);
  const dr = defOp('drill'); dr.name = 'Drill M8 tap holes'; dr.toolId = T('drill').id; dr.p.bottom = rnd(-12*u); dr.sel = sp.sel.slice();
  const tp = defOp('drill'); tp.name = 'Tap M8'; tp.toolId = T('tap').id; tp.p.cycle = 'G84'; tp.p.bottom = rnd(-10*u); tp.p.addTip = false; tp.sel = sp.sel.slice();
  const co = defOp('contour'); co.name = 'Outside profile'; co.toolId = (S.tools.find(t => t.type === 'flat' && t.dia >= 8*u) || T('flat')).id; co.sel = byL('OUTLINE').map(c => c.id); co.p.bottom = rnd(-12*u); co.p.stepdown = rnd(4*u);
  S.ops = [face, pk, sp, dr, tp, co]; activeOp = pk;
  drawGeom(); drawStock(); clearSim(); setView('iso'); renderPanel(); schedule();
}
$('#bDemo').onclick = () => { if (S.ops.length && !confirm('Replace the current project with the demo part?')) return; demo(); };

/* ============================== top bar / view buttons ============================== */
$('#bPost').onclick = () => { S.ops.forEach(o => o.moves = null); schedule(); };
$('#bDl').onclick = () => { if (!gcode.length || !S.ops.some(o => o.enabled && o.moves && o.moves.length)){ alert('Nothing to post yet — add operations first.'); return; } download(`O${String(S.setup.progNum).padStart(4, '0')}.nc`, gcode.join('\r\n') + '\r\n'); };
$('#bCopy').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(gcode.join('\n')).then(() => status('G-code copied.')); };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); renderPanel(); });
document.querySelectorAll('#vbtns [data-v]').forEach(b => b.onclick = () => setView(b.dataset.v === 'fit' ? 'iso' : b.dataset.v));
document.querySelectorAll('#vbtns [data-l]').forEach(b => b.onclick = () => { const g = G[b.dataset.l]; g.visible = !g.visible; b.classList.toggle('on', g.visible); if (b.dataset.l === 'path') G.tool.visible = g.visible; });
$('#slider').addEventListener('input', onSlide);
$('#code').addEventListener('scroll', renderCode);
$('#bVerify').onclick = verify;
let playing = false;
$('#bPlay').onclick = () => {
  playing = !playing; $('#bPlay').textContent = playing ? '❚❚' : '▶';
  const sl = $('#slider');
  if (playing && +sl.value >= +sl.max) sl.value = 0;
  const step = () => { if (!playing) return; const v = Math.min(+sl.max, +sl.value + +$('#speed').value); sl.value = v; onSlide(); if (v >= +sl.max){ playing = false; $('#bPlay').textContent = '▶'; return; } requestAnimationFrame(step); };
  step();
};

/* ============================== boot ============================== */
initView();
const saved = load('cam.project', null);
if (saved && saved.setup){ try { applyProject(saved); } catch(e){ console.error(e); } }
else {
  S.tools = load('cam.tools.mm', null) || defTools('mm');
  drawGeom(); drawStock(); setView('iso'); renderPanel(); renderCode(); renderStats();
}
window.__cam = {S, post, regen, genOp, parseDXF, dxfItems, buildChains, openFile, demo, get gcode(){ return gcode; }, get simPts(){ return simPts; }, verify};
</script>
</body>
