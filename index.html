.spbar{height:3px;background:#ddd;border-radius:2px;overflow:hidden;margin-top:4px}

.hdr-wrap{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e5e5e5}
.hdr{border-bottom:none;position:static}

async function hashPw(pw){
  var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,"0"); }).join("");
}

// Net-Aware Sync Load
async function load(){
  try{
    var u=localStorage.getItem("di11u"); if(u) G.users=JSON.parse(u);
    var l=localStorage.getItem("di11l"); if(l) G.logs=JSON.parse(l);
    var r=localStorage.getItem("di11r"); if(r) G.rfqs=JSON.parse(r);
    var j=localStorage.getItem("di11j"); if(j) G.jobs=JSON.parse(j);
    var p=localStorage.getItem("di11p"); if(p) G.procs=JSON.parse(p);
    var t=localStorage.getItem("di11t"); if(t){ G.timer=JSON.parse(t); G.secs=Math.floor((Date.now()-G.timer.ms)/1000); }
  }catch(e){}
  if(!G.jobs.length)  G.jobs =JSON.parse(JSON.stringify(DEF_JOBS));
  if(!G.procs.length) G.procs=JSON.parse(JSON.stringify(DEF_PROCS));

  try {
    var response = await fetch(WEB_APP_URL + "?action=loadAll");
    var resData = await response.json();
    if (resData.status === "success" && resData.data) {
      if (Object.keys(resData.data.users).length) G.users = resData.data.users;
      G.jobs = resData.data.jobs;
      G.procs = resData.data.procs;
      G.logs = resData.data.logs;
      G.rfqs = resData.data.rfqs;
      render();
    }
  } catch (e) { console.warn("Live pull dropped. Standard offline buffer backup active."); }
}

function createQBEstimate(rfq){
  var items=(rfq.items||[]).filter(function(it){ return it.inOrder!==false; });
  var missing=items.filter(function(it){ return !it.unitPrice||it.unitPrice<=0; });
  if(missing.length){ toast('Enter unit price for all items before creating QB estimate.'); return; }
  var lineItems=items.map(function(it){
    var procDesc=(it.procs||[]).map(function(p){ return p.proc+" ("+p.est+"min)"; }).join(", ");
    var desc=esc(it.item)+(procDesc?" | Processes: "+procDesc:"");
    var qty=it.orderedQty||it.qty;
    return "Item: "+it.item+", Description: "+desc+", Qty: "+qty+", UnitPrice: "+it.unitPrice;
  }).join("; ");
  toast("QuickBooks Sync Active Engine Triggered...", 2500);
}

async function doRegister(){

  var done=mine.filter(function(p){ return p.status==="Completed"; });
  var ap=G.timer?G.procs.find(function(p){ return p.jobId===G.timer.jobId&&p.seq===G.timer.seq; }):null;
  var over=ap?(G.secs/60)>ap.est:false;

      h+="<div style=\"margin-top:5px\"><span class=\"bdg bn\">Est: "+p.est+" min</span></div></div><span class=\"bdg bn\">"+esc(p.status)+"</span></div>";
      h+="<button class=\"btn btn-g\" onclick=\"startTimer('"+esc(p.jobId)+"',"+p.seq+")\" style=\"margin-top:8px\">&#9654; Start</button></div>";
    });
  }
  if(locked.length){
    h+="<hr><div class=\"sec\">Waiting for QA clearance ("+locked.length+")</div>";

    });
  }
  if(done.length){
    h+="<hr><div class=\"sec\">Completed (awaiting QA)</div>";
    done.forEach(function(p){
      var l=G.logs.find(function(x){ return x.jobId===p.jobId&&x.seq===p.seq&&x.type==="O"; });

  h+="</div>";
  return h;
}
function startTimer(jobId,seq){
  if(G.tick) clearInterval(G.tick);
  var p=G.procs.find(function(x){ return x.jobId===jobId&&x.seq===seq; });
  if(!p||p.status==="Locked"){ toast("This process is locked. Wait for QA on the previous step."); return; }
  var now=new Date();
  G.timer={jobId:jobId,seq:seq,who:G.user.name,ms:Date.now(),st:fmtT(now),sd:fmtD(now),pn:p.proc,iN:p.item,dN:p.dwg,est:p.est};
  G.procs=G.procs.map(function(x){ return (x.jobId===jobId&&x.seq===seq)?Object.assign({},x,{status:"In Progress"}):x; });
  G.secs=0; save();
  G.tick=setInterval(function(){
    G.secs=Math.floor((Date.now()-G.timer.ms)/1000);
    var el=document.getElementById("TD"); if(!el) return;
    el.textContent=fmtS(G.secs);
    var ap2=G.procs.find(function(p){ return p.jobId===G.timer.jobId&&p.seq===G.timer.seq; });
    el.className="tnum "+(ap2&&(G.secs/60)>ap2.est?"tov":"tok");
  },1000);
  render();
}
async function stopTimer(){
  if(!G.timer) return;
  clearInterval(G.tick); G.tick=null;
  var now=new Date(); var actual=Math.round(G.secs/60)||1; var t=G.timer; var saved=t.est-actual;
  G.procs=G.procs.map(function(x){ return (x.jobId===t.jobId&&x.seq===t.seq)?Object.assign({},x,{status:"Completed"}):x; });
  var log={id:uid(),jobId:t.jobId,dwg:t.dN,item:t.iN,seq:t.seq,proc:t.pn,who:t.who,date:t.sd,st:t.st,et:fmtT(now),actual:actual,est:t.est,saved:saved,type:"O"};
  G.logs.push(log); G.timer=null; G.secs=0; save();
  toast(saved>=0?"Done! Saved "+saved+" min. Waiting for QA.":"Done. "+Math.abs(saved)+" min over. Waiting for QA.",3500);
  render();
}

function pickQA(k,v,el){
  G.qaMap[k]=v;

async function submitQA(jobId,seq,k){
  var st=G.qaMap[k]; if(!st){ toast("Select a QA result first."); return; }
  var notes=(document.getElementById("QN"+k)||{value:""}).value;
  var isPass=QA_PASS.indexOf(st)>=0;
  if(isPass){
    G.procs=G.procs.map(function(p){
      if(p.jobId===jobId&&p.seq===seq) return Object.assign({},p,{qaStatus:st,qaNotes:notes});
      if(p.jobId===jobId&&p.seq===seq+1&&p.status==="Locked") return Object.assign({},p,{status:"Pending"});
      return p;
    });
    var nextP=G.procs.find(function(p){ return p.jobId===jobId&&p.seq===seq+1; });
    toast(st+" ✓"+(nextP?" — "+nextP.proc+" unlocked":" — Complete!"),3500);
  } else {
    G.procs=G.procs.map(function(p){ return (p.jobId===jobId&&p.seq===seq)?Object.assign({},p,{status:"Pending",qaStatus:null,qaNotes:null}):p; });
    toast(st+" — Assigned operator must redo this process step.",3500);
  }
  G.logs.push({id:uid(),jobId:jobId,seq:seq,proc:(G.procs.find(function(p){ return p.jobId===jobId&&p.seq===seq; })||{proc:""}).proc,who:G.user.name,date:fmtD(),qaStatus:st,notes:notes,type:"QA"});
  delete G.qaMap[k]; checkJobComplete(jobId); save(); render();
}

  var cbEl=document.getElementById("PC"+pfx+safe); var rowEl=document.getElementById("PR"+pfx+safe);
  if(!rowEl) return;
  if(G.rfqItemSel[selKey]!==undefined){ delete G.rfqItemSel[selKey]; rowEl.classList.remove("on"); var h1=document.getElementById("PH"+pfx+safe); if(h1) h1.textContent="tap"; }
  else { G.rfqItemSel[selKey]=0; rowEl.classList.add("on"); var h2=document.getElementById("PH"+pfx+safe); if(h2) h2.textContent="✓ selected"; setTimeout(function(){ var ti=document.getElementById("PT"+pfx+safe); if(ti) ti.focus(); },50); }
  if(cbEl) cbEl.checked=(G.rfqItemSel[selKey]!==undefined);
}
function updIH(pfxsafe,v){ var m=parseInt(v)||0; var el=document.getElementById("IH"+pfxsafe); if(el) el.textContent=m>0?"= "+((m/60).toFixed(1))+"h":""; }
function calcRFQTotal(){
  var total=0;
  for(var i=0;i<G.rfqItems.length;i++){
    var qty=parseInt((document.getElementById("IQ"+i)||{value:"1"}).value)||0;
    var price=parseFloat((document.getElementById("IP"+i)||{value:"0"}).value)||0;
    var sub=qty*price; total+=sub;
    var stEl=document.getElementById("IST"+i);
    if(stEl) stEl.textContent=sub>0?"= &#8369;"+sub.toLocaleString("en-PH",{minimumFractionDigits:2}):"";
  }
  var el=document.getElementById("rfq-total-amt");
  if(el) el.innerHTML="&#8369; "+total.toLocaleString("en-PH",{minimumFractionDigits:2});
}
function submitRFQ(){
  var cust=(document.getElementById("NQC")||{value:""}).value.trim(); G.err="";
  if(!cust){ G.err="Customer name is required."; render(); return; }
  var items=[]; var totalEst=0;
  for(var i=0;i<G.rfqItems.length;i++){
    var iname=(document.getElementById("IN"+i)||{value:""}).value.trim();
    if(!iname){ G.err="Enter item name for Item "+(i+1)+"."; render(); return; }
    var procs=[];
    PROCS.forEach(function(p){ var safe=p.replace(/ /g,"_"); var pfx="I"+i; var cb=document.getElementById("PC"+pfx+safe); if(cb&&cb.checked){ var t=parseInt((document.getElementById("PT"+pfx+safe)||{value:""}).value)||0; procs.push({proc:p,est:t}); } });
    var missing=procs.filter(function(p){ return p.est<=0; });
    if(missing.length){ G.err="Item "+(i+1)+" ("+iname+"): enter estimated time for "+missing.map(function(p){ return p.proc; }).join(", "); render(); return; }
    var estTotal=procs.reduce(function(s,p){ return s+p.est; },0); totalEst+=estTotal;
    var iQty=parseInt((document.getElementById("IQ"+i)||{value:"1"}).value)||1;
    var iPrice=parseFloat((document.getElementById("IP"+i)||{value:"0"}).value)||null;
    items.push({iid:i+1,item:iname,dwg:(document.getElementById("ID"+i)||{value:""}).value.trim(),qty:iQty,mat:(document.getElementById("IM"+i)||{value:""}).value,procs:procs,estTotal:estTotal,orderedQty:null,inOrder:true,unitPrice:iPrice});
  }
  var autoTotal=items.reduce(function(s,it){ return s+(it.unitPrice&&it.qty?it.unitPrice*it.qty:0); },0);
  var rfq={id:genRFQ(),cust:cust,contact:(document.getElementById("NQK")||{value:""}).value.trim(),source:(document.getElementById("NQS")||{value:"Manual"}).value||"Manual",dateReceived:(document.getElementById("NQDT")||{value:""}).value||fmtD(),deliveryDate:(document.getElementById("NQDL")||{value:""}).value,notes:(document.getElementById("NQN")||{value:""}).value.trim(),items:items,totalEst:totalEst,status:"New",createdBy:G.user.name,quoteAmt:autoTotal>0?autoTotal.toFixed(2):"",quoteNotes:"",quoteDate:"",jobIds:[]};
  G.rfqs.push(rfq); G.rfqItems=[]; G.rfqItemSel={}; save();
  toast("RFQ "+rfq.id+" saved!",3000); nav("sales");
}

function rQuote(){
  var rfq=G.rfqs.find(function(r){ return r.id===G.activeRfq; }); if(!rfq){ nav("sales"); return ""; }
  var canSales=G.user.role==="sales"||isMD();
  var nonFinal=["Pending MD Approval","MD Approved","Accepted","Rejected","Cancelled","PO Received","In Production"].indexOf(rfq.status)<0;
  var isAccepted=["Accepted","PO Received","In Production"].indexOf(rfq.status)>=0;
  var isMDApproved=["MD Approved","Accepted","PO Received","In Production"].indexOf(rfq.status)>=0;

  var h=hdr("Quotation &middot; "+esc(rfq.id),"");
  h+="<div class=\"pg\">";

  var allSteps=["New","For Estimation","Ready to Quote","Quoted","Accepted","PO Received","In Production"];
  var ci2=allSteps.indexOf(rfq.status);
  var showSteps=["New","Quoted","Pending MD Approval","MD Approved","Accepted","PO Received","In Production"];
  h+="<div style=\"display:flex;align-items:center;gap:3px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px\">";
  showSteps.forEach(function(s,i){
    var sIdx=allSteps.indexOf(s); var active=ci2>=sIdx;
    h+="<div style=\"flex-shrink:0;text-align:center\"><div style=\"width:26px;height:26px;border-radius:50%;background:"+(active?"#1565C0":"#eee")+";color:"+(active?"#fff":"#999")+";display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin:0 auto 3px\">"+(i+1)+"</div><div style=\"font-size:10px;color:"+(rfq.status===s?"#1565C0":active?"#888":"#bbb")+";font-weight:"+(rfq.status===s?"700":"400")+";white-space:nowrap\">"+s+"</div></div>";
    if(i<showSteps.length-1) h+="<div style=\"flex:1;height:2px;background:"+(ci2>allSteps.indexOf(s)?"#1565C0":"#eee")+";margin-bottom:14px;min-width:6px\"></div>";
  });
  h+="</div>";

  h+="<div class=\"card\" style=\"background:#fafafa;margin-bottom:14px\"><table class=\"tbl\"><tbody>";
  h+="<tr><td style=\"color:#888;width:90px\">Customer</td><td style=\"font-weight:700\">"+esc(rfq.cust)+"</td></tr>";
  h+="<tr><td style=\"color:#888\">Contact</td><td>"+(rfq.contact?esc(rfq.contact):"&mdash;")+"</td></tr>";
  h+="<tr><td style=\"color:#888\">Source</td><td>"+esc(rfq.source)+"</td></tr>";
  h+="<tr><td style=\"color:#888\">Received</td><td>"+esc(rfq.dateReceived)+"</td></tr>";
  if(rfq.deliveryDate) h+="<tr><td style=\"color:#888\">Delivery</td><td><strong style=\"color:#C62828\">"+esc(rfq.deliveryDate)+"</strong></td></tr>";
  h+="</tbody></table>";
  if(rfq.notes) h+="<div style=\"margin-top:8px;padding:8px;background:#fff;border-radius:8px;font-size:12px;color:#666;border-left:2px solid #ddd\"><strong>Notes:</strong> "+esc(rfq.notes)+"</div>";
  h+="</div>";

  if(isAccepted&&canEditPO()){
    h+="<div class=\"sec\">PO Confirmation</div>";
    (rfq.items||[]).forEach(function(it,idx){
      var isIn=it.inOrder!==false;
      var oQty=it.orderedQty!==null&&it.orderedQty!==undefined?it.orderedQty:it.qty;
      var uPrice=it.unitPrice||"";
      var jobId=(rfq.jobIds||[]).find(function(jid){ var j=G.jobs.find(function(x){ return x.id===jid; }); return j&&j.item===it.item; });
      h+="<div class=\"po-item "+(isIn?"included":"excluded")+"\">";
      h+="<div class=\"po-hd "+(isIn?"included":"excluded")+"\"><input type=\"checkbox\" id=\"POC"+idx+"\" style=\"width:16px;height:16px;accent-color:#1565C0;cursor:pointer\""+(isIn?" checked":"")+" onchange=\"toggleOrderItem('"+esc(rfq.id)+"',"+idx+",this.checked)\">";
      h+="<div style=\"flex:1;margin-left:2px\"><div style=\"font-size:13px;font-weight:700;"+(isIn?"":"text-decoration:line-through;color:#999")+"\">"+esc(it.item)+"</div><div style=\"font-size:11px;color:#888\">"+(it.dwg?esc(it.dwg)+" &middot; ":"")+(isIn?"In PO":"Excluded")+"</div></div>";
      if(jobId) h+="<span class=\"bdg bd\" style=\"font-size:10px\">&#9881; "+esc(jobId)+"</span>";
      h+="</div>";
      if(isIn&&!jobId){
        h+="<div class=\"po-body\">";
        h+="<div style=\"display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:10px\">";
        h+="<div><div class=\"lbl\">Ordered qty</div><input type=\"number\" class=\"qty-inp\" id=\"POQ"+idx+"\" min=\"1\" value=\""+oQty+"\" onchange=\"updateOrderQty('"+esc(rfq.id)+"',"+idx+",parseInt(this.value)||1)\"></div>";
        h+="<div><div class=\"lbl\" style=\"color:#2E7D32\">Unit price (&#8369;)</div><input type=\"number\" class=\"price-inp\" id=\"POP"+idx+"\" min=\"0\" step=\"0.01\" value=\""+(uPrice||"")+"\" onchange=\"updateUnitPrice('"+esc(rfq.id)+"',"+idx+",parseFloat(this.value)||0)\"></div>";
        h+="</div>";
        h+="<button class=\"btn btn-p\" onclick=\"createJobFromItem('"+esc(rfq.id)+"',"+idx+")\">&#9881; Create Job Order &rarr;</button>";
        h+="</div>";
      } else if(isIn&&jobId){
        h+="<div class=\"po-body\"><div style=\"font-size:12px;color:#2E7D32\">Job order <strong>"+esc(jobId)+"</strong> active inside production grid.</div></div>";
      }
      h+="</div>";
    });

    if(rfq.status==="Accepted") h+="<button class=\"btn btn-or\" onclick=\"setRfqSt('"+esc(rfq.id)+"','PO Received')\">Mark PO as received</button>";
  } else {
    h+="<div class=\"sec\">Items ("+(rfq.items||[]).length+")</div>";
    (rfq.items||[]).forEach(function(it,idx){
      h+="<div class=\"card card-pu\"><div class=\"r\"><div><div class=\"ct\">"+esc(it.item)+"</div><div class=\"cm\">Qty: "+it.qty+" pc(s)</div></div></div></div>";
    });
  }

  if(canSales&&nonFinal){
    h+="<div class=\"sec\">Quotation Parameters</div>";
    h+="<div class=\"fld\"><label class=\"lbl\">Total quote amount (&#8369;)</label><input class=\"inp\" id=\"QAMT\" type=\"number\" min=\"0\" step=\"0.01\" value=\""+esc(rfq.quoteAmt||"")+"\"></div>";
    h+="<div class=\"fld\"><label class=\"lbl\">Quote notes / terms</label><textarea class=\"inp\" id=\"QNOTES\">"+esc(rfq.quoteNotes||"")+"</textarea></div>";
    h+="<button class=\"btn btn-p\" onclick=\"saveQuote('"+esc(rfq.id)+"')\">Save quote</button>";
  } else if(rfq.quoteAmt&&/PO/i.test(rfq.status)){
     h+="<div class=\"card card-b\"><h4>Confirmed PO Valuation Matrix</h4><div style=\"font-size:24px;font-weight:700;color:#1B5E20\">&#8369;"+Number(rfq.quoteAmt).toLocaleString()+"</div></div>";
  }

  if(canSales&&nonFinal){
    h+="<div class=\"sec\">Update state pipeline</div>";
    if(rfq.status==="New")            h+="<button class=\"btn btn-p\" onclick=\"setRfqSt('"+esc(rfq.id)+"','For Estimation')\">Send to estimation</button>";
    if(rfq.status==="For Estimation") h+="<button class=\"btn btn-yl\" onclick=\"setRfqSt('"+esc(rfq.id)+"','Ready to Quote')\">Ready to quote</button>";
    if(rfq.status==="Pending MD Approval" && isMD()) h+="<button class=\"btn btn-g\" onclick=\"approveQuote('"+esc(rfq.id)+"')\">Approve quote</button>";
    if(rfq.status==="MD Approved")    h+="<button class=\"btn btn-p\" onclick=\"setRfqSt('"+esc(rfq.id)+"','Quoted')\">Mark as quoted</button>";
    if(rfq.status==="Quoted"){
       h+="<button class=\"btn btn-g\" onclick=\"setRfqSt('"+esc(rfq.id)+"','Accepted')\">Customer accepted</button>";
    }
  }
  h+="</div>";
  return h;
}
function toggleOrderItem(rfqId,idx,checked){
  G.rfqs=G.rfqs.map(function(r){ if(r.id!==rfqId) return r; var items=(r.items||[]).map(function(it,i){ return i===idx?Object.assign({},it,{inOrder:checked}):it; }); return Object.assign({},r,{items:items}); });
  save(); render();
}
function updateOrderQty(rfqId,idx,qty){
  G.rfqs=G.rfqs.map(function(r){ if(r.id!==rfqId) return r; var items=(r.items||[]).map(function(it,i){ return i===idx?Object.assign({},it,{orderedQty:qty}):it; }); return Object.assign({},r,{items:items}); });
  save();
}
function updateUnitPrice(rfqId,idx,price){
  G.rfqs=G.rfqs.map(function(r){ if(r.id!==rfqId) return r; var items=(r.items||[]).map(function(it,i){ return i===idx?Object.assign({},it,{unitPrice:price}):it; }); return Object.assign({},r,{items:items}); });
  save();
}
function saveQuote(id){
  var amt=parseFloat((document.getElementById("QAMT")||{value:"0"}).value||0); if(amt<=0){ toast("Enter quote amount."); return; }
  var notes=(document.getElementById("QNOTES")||{value:""}).value;
  G.rfqs=G.rfqs.map(function(r){ if(r.id!==id) return r; return Object.assign({},r,{quoteAmt:amt.toFixed(2),quoteNotes:notes,quoteDate:fmtD(),status:"Pending MD Approval"}); });
  save(); toast("Quote forwarded to MD."); render();
}
function approveQuote(id){
  G.rfqs=G.rfqs.map(function(r){ return r.id===id?Object.assign({},r,{status:"MD Approved"}):r; });
  save(); toast("Quote approved."); render();
}
function deleteRFQ(id){
  if(!confirm("Delete RFQ permanently?")) return;
  G.rfqs=G.rfqs.filter(function(r){ return r.id!==id; }); save(); nav("sales");
}
function setRfqSt(id,st){
  G.rfqs=G.rfqs.map(function(r){ return r.id===id?Object.assign({},r,{status:st}):r; });
  save(); render();
}
function createJobFromItem(rfqId,itemIdx){
  var rfq=G.rfqs.find(function(r){ return r.id===rfqId; }); if(!rfq) return;
  var it=rfq.items[itemIdx]; if(!it) return;
  var oQty=it.orderedQty||it.qty;
  G.jobRows=it.procs.map(function(p){ return {proc:p.proc,to:"",est:p.est}; });
  G.jobPrefill={dwg:it.dwg||"",item:it.item,cust:rfq.cust,qty:oQty,rfqId:rfq.id,rfqItemIdx:itemIdx};
  nav("new-job");
}

function rProd(){
  var readyRFQs=G.rfqs.filter(function(r){
    return ["Accepted","PO Received","In Production"].indexOf(r.status)>=0&&(r.items||[]).some(function(it){
      if(it.inOrder===false) return false;
      return !G.jobs.some(function(j){ return (r.jobIds||[]).indexOf(j.id)>=0 && j.item===it.item; });
    });
  });
  var h=hdr("Production Setup","");
  h+="<div class=\"pg\"><button class=\"btn btn-p\" onclick=\"newJob()\" style=\"margin-bottom:14px\">+ New Job Order</button>";
  if(readyRFQs.length){
    h+="<div class=\"sec\">Ready for Production Booking</div>";
    readyRFQs.forEach(function(r){
      h+="<div class=\"card card-y\"><strong>"+esc(r.cust)+" ("+r.id+")</strong>";
      (r.items||[]).forEach(function(it,idx){
        if(it.inOrder===false) return;
        var already=G.jobs.some(function(j){ return (r.jobIds||[]).indexOf(j.id)>=0 && j.item===it.item; });
        if(!already){
          h+="<div style=\"display:flex;justify-content:space-between;margin-top:6px\"><span>"+esc(it.item)+"</span><button class=\"btn btn-p\" style=\"width:auto;padding:4px 8px\" onclick=\"createJobFromItem('"+esc(r.id)+"',"+idx+")\">Book</button></div>";
        }
      });
      h+="</div>";
    });
  }
  h+="<div class=\"sec\">Active Production Pipeline</div>";
  G.jobs.filter(function(j){ return j.status==="Active"; }).forEach(function(j){
    h+="<div class=\"card\"><h4>"+esc(j.item)+" ("+j.id+")</h4>";
    var ps=G.procs.filter(function(p){ return p.jobId===j.id; });
    ps.forEach(function(p){
       h+="<div class=\"proc-step\"><span>Seq "+p.seq+": "+esc(p.proc)+" &mdash; "+esc(p.to)+"</span><span class=\"bdg bn\">"+esc(p.qaStatus||p.status)+"</span></div>";
    });
    h+="</div>";
  });
  return h;
}
function newJob(){ G.jobRows=[]; G.jobPrefill=null; nav("new-job"); }

function rNewJob(){
  var ops=PROFILES.filter(function(p){ return p.role==="operator"; });
  var pf=G.jobPrefill||{}; var jid=nextJO(); var rows="";
  if(G.jobRows.length){
    G.jobRows.forEach(function(r,i){
      var procOpts=""; PROCS.forEach(function(p){ procOpts+="<option "+(r.proc===p?"selected":"")+">"+p+"</option>"; });
      var opOpts=""; ops.forEach(function(o){ opOpts+="<option value=\""+o.name+"\" "+(r.to===o.name?"selected":"")+">"+o.name+"</option>"; });
      rows+="<div class=\"prow on\"><div class=\"prow-bd\" style=\"display:block\"><select onchange=\"G.jobRows["+i+"].proc=this.value\">"+procOpts+"</select><select onchange=\"G.jobRows["+i+"].to=this.value\">"+opOpts+"</select><input type=\"number\" placeholder=\"min\" value=\""+(r.est||"")+"\" oninput=\"G.jobRows["+i+"].est=parseInt(this.value)||0\"></div></div>";
    });
  }
  var h=hdr("Create Production Route","");
  h+="<div class=\"pg\">"+errBox();
  h+="<div class=\"fld\"><label class=\"lbl\">Job Order ID</label><input class=\"inp\" id=\"JO\" value=\""+jid+"\"></div>";
  h+="<div class=\"fld\"><label class=\"lbl\">Item Name</label><input class=\"inp\" id=\"JIT\" value=\""+esc(pf.item||"")+"\"></div>";
  h+="<div class=\"fld\"><label class=\"lbl\">Drawing ID</label><input class=\"inp\" id=\"JDW\" value=\""+esc(pf.dwg||"")+"\"></div>";
  h+="<div class=\"fld\"><label class=\"lbl\">Customer Master</label><input class=\"inp\" id=\"JCU\" value=\""+esc(pf.cust||"")+"\"></div>";
  h+="<div class=\"fld\"><label class=\"lbl\">Target Quantity</label><input class=\"inp\" type=\"number\" id=\"JQTY\" value=\""+(pf.qty||1)+"\"></div>";
  h+="<div class=\"sec\">Route Mapping</div>"+rows;
  h+="<button class=\"btn btn-yl\" onclick=\"G.jobRows.push({proc:PROCS[0],to:PROFILES.filter(function(p){return p.role==='operator'})[0].name,est:0});render();\">+ Add operation step</button>";
  h+="<button class=\"btn btn-p\" onclick=\"submitJob()\">Push into live production queue</button></div>";
  return h;
}
function submitJob(){
  var jo=document.getElementById("JO").value.trim();
  var item=document.getElementById("JIT").value.trim();
  var dwg=document.getElementById("JDW").value.trim();
  var cust=document.getElementById("JCU").value.trim();
  var qty=parseInt(document.getElementById("JQTY").value)||1;
  if(!jo||!item){ toast("Fill required identifiers."); return; }
  var newJob={id:jo,dwg:dwg,item:item,cust:cust,qty:qty,status:"Active"};
  var newProcs=G.jobRows.map(function(r,i){
    return {jobId:jo,dwg:dwg,item:item,seq:i+1,proc:r.proc,to:r.to,est:r.est,status:i===0?"Pending":"Locked",queuePos:i+1};
  });
  G.jobs.push(newJob); G.procs=G.procs.concat(newProcs);
  if(G.jobPrefill&&G.jobPrefill.rfqId){
     G.rfqs=G.rfqs.map(function(r){
       if(r.id!==G.jobPrefill.rfqId) return r;
       var ids=(r.jobIds||[]).concat([jo]);
       return Object.assign({},r,{jobIds:ids,status:"In Production"});
     });
  }
  G.jobRows=[]; G.jobPrefill=null; save(); nav("production");
}

function ensureQueuePos(){}
function getOpQueue(opName){ return G.procs.filter(function(p){ return p.to===opName&&p.status==="Pending"; }); }

function rOverview(){
  var h=hdr("Trello Station Board","Live synchronization viewport");
  h+="<div class=\"pg pg-wide\"><div class=\"floor-board\">";
  PROFILES.filter(function(p){return p.role==="operator"}).forEach(function(op){
     var mine=G.procs.filter(function(x){return x.to===op.name;});
     var run=mine.find(function(x){return x.status==="In Progress"});
     var q=mine.filter(function(x){return x.status==="Pending"});
     h+="<div class=\"station-col\"><strong>"+op.machine+" ("+op.name+")</strong>";
     if(run) h+="<div class=\"run-card\">🏃 "+esc(run.item)+" &middot; "+run.proc+"</div>";
     q.forEach(function(x){ h+="<div class=\"drag-card\">⏳ "+esc(x.item)+" ("+x.jobId+")</div>"; });
     h+="</div>";
  });
  h+="</div></div>";
  return h;
}

function checkJobComplete(jobId){
  var ps=G.procs.filter(function(p){return p.jobId===jobId;});
  if(ps.length && ps.every(function(p){return p.qaStatus==="Pass"})){
     G.jobs=G.jobs.map(function(j){return j.id===jobId?Object.assign({},j,{status:"Completed",completedAt:fmtD()}):j;});
     save();
  }
}
function openJob(id){ G.activeJobId=id; nav("job-detail"); }

function rJobDetail(){
  var j=G.jobs.find(function(x){return x.id===G.activeJobId;}); if(!j) return "";
  var ps=G.procs.filter(function(p){return p.jobId===j.id;});
  var h=hdr("Traceability matrix","")+"<div class=\"pg\"><h3>"+esc(j.item)+"</h3>";
  ps.forEach(function(p){ h+="<div class=\"card\">Seq "+p.seq+": "+p.proc+" &mdash; "+p.to+" ("+(p.qaStatus||p.status)+")</div>"; });
  return h;
}
function rSearch(){ return "<div class=\"pg\">Use upper diagnostic indexing engine row bar to query database entries.</div>"; }
function rBackup(){ return "<div class=\"pg\">Network Sync Interface active. Sheet contains absolute transaction records.</div>"; }

function rSummary(){
  var h=hdr("Performance Metrics","")+"<div class=\"pg\">";
  PROFILES.filter(function(p){return p.role==="operator"}).forEach(function(op){
     var ls=G.logs.filter(function(l){return l.who===op.name;});
     h+="<div class=\"card\"><strong>"+op.name+"</strong>: "+ls.length+" workflow logs logged.</div>";
  });
  return h;
}
function rSettings(){
  var h=hdr("User account credentials","")+"<div class=\"pg\">";
  Object.values(G.users).forEach(function(u){ h+="<div class=\"card\">"+u.name+" &mdash; Account status: "+u.status+"</div>"; });
  return h;
}
function rChangePw(){ return "<div class=\"pg\">Modify user authentication tokens using security fields.</div>"; }

async function init(){
  clearOldData(); G.scr="loading"; render();
  await load();
  if(G.timer){
    G.tick=setInterval(function(){
      G.secs=Math.floor((Date.now()-G.timer.ms)/1000);
      var el=document.getElementById("TD"); if(el) el.textContent=fmtS(G.secs);
    },1000);
  }
  nav("login");
}
init();
</script>
