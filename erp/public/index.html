<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dynamic ERP</title><link rel="stylesheet" href="/erp/erp.css"><link rel="icon" href="/erp/icon.svg"></head>
<body>
<div id="top"><b>Dynamic ERP</b><span class="co" id="co">Dynamic Int'l. Precision Technology &amp; Tooling Inc.</span><span class="sp"></span><span class="u" id="who"></span><button id="out" style="display:none">Sign out</button></div>
<div id="nav"></div>
<div id="main"></div>
<script src="/erp/erp.js"></script>
<script>
let ME = null, ST = [], STBY = {};
const NAV = [['dashboard', 'Dashboard', 'qa'], ['sales', 'Sales / RFQ', 'office'], ['jobs', 'Jobs', 'operator'], ['planning', 'Planning', 'office'], ['board', 'Floor Board', 'operator'], ['engineering', 'Engineering (CAD/CAM)', 'operator'], ['quality', 'Quality', 'qa'], ['tools', 'Tools', 'operator'], ['materials', 'Materials & Purchasing', 'office'], ['machines', 'Machines & Maintenance', 'operator'], ['facilities', 'Facilities', 'office'], ['delivery', 'Delivery & Billing', 'office'], ['costing', 'Costing', 'office'], ['people', 'People', 'office'], ['log', 'Activity log', 'office']];
const ROLES = {owner:5, office:4, qa:3, maintenance:3, programmer:3, operator:1};
const can = r => ME && (ROLES[ME.role] || 0) >= (ROLES[r] || 0);
const PRIO = [[1, '1 - Rush'], [2, '2 - Normal'], [3, '3 - Low']], RFQ_ST = ['new', 'estimating', 'quoted', 'won', 'lost'].map(s => [s, s]), JOB_ST = ['planned', 'released', 'in_progress', 'qa', 'done', 'shipped'].map(s => [s, s.replace('_', ' ')]);
const stOpts = () => ST.map(s => [s.id, s.code + ' - ' + s.name.replace(/^.*? - /, '')]);

async function boot(){
  try { const m = await api('me'); ME = m.user; ST = m.stations; ST.forEach(s => STBY[s.id] = s); if (m.company) document.getElementById('co').textContent = m.company; } catch (e){ ME = null; }
  if (!ME) return login();
  document.getElementById('who').textContent = `${ME.name} (${ME.role})`; document.getElementById('out').style.display = ''; document.getElementById('out').onclick = () => { localStorage.removeItem('erp.token'); location.reload(); };
  document.getElementById('nav').innerHTML = NAV.filter(n => can(n[2])).map(n => `<a href="#${n[0]}" data-n="${n[0]}">${n[1]}</a>`).join('');
  window.onhashchange = route; route(); live(kind => { const page = (location.hash.slice(1) || 'dashboard').split('/')[0]; if (['dashboard', 'planning', 'jobs', 'sales'].includes(page) && !document.querySelector('.dlg-bg')) route(); });
}
function login(){ document.getElementById('main').innerHTML = `<div class="login"><h2>Dynamic ERP</h2><div class="fr"><label>Name</label><input id="nm" value="Noah"></div><div class="fr"><label>PIN</label><input id="pn" type="password" value=""></div><div class="bar"><button class="pri" id="go">Sign in</button></div><div class="hint">Demo PINs: Noah 1234 (owner) · Office 1111 · QA 4444 · Maintenance 5555 · Operator CNC1 2222</div></div>`; const go = async () => { try { const r = await api('login', 'POST', {name:$('#nm').value.trim(), pin:$('#pn').value}); localStorage.setItem('erp.token', r.token); location.reload(); } catch (e){ toast(e.message, true); } }; $('#go').onclick = go; $('#pn').onkeydown = e => { if (e.key === 'Enter') go(); }; }
function route(){ const [page, id] = (location.hash.slice(1) || 'dashboard').split('/'); $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.n === page)); const fn = PAGES[page] || PAGES.dashboard; const m = document.getElementById('main'); m.innerHTML = '<div class="hint">Loading…</div>'; Promise.resolve(fn(m, id)).catch(e => { m.innerHTML = `<div class="err">${esc(e.message)}</div>`; }); }
const money = v => v == null || v === '' ? '' : '₱' + (+v).toLocaleString('en-PH', {maximumFractionDigits:0});

const PAGES = {
  async dashboard(m){
    const d = await api('dashboard');
    const card = (lbl, v, cls = '', sub = '') => `<div class="card ${cls}"><div class="lbl">${lbl}</div><div class="big">${v}</div><div class="hint">${sub}</div></div>`;
    m.innerHTML = `<h2>Today ${d.today}</h2><div class="cards">${card('Late jobs', d.late.length, d.late.length ? 'bad' : 'ok')}${card('Due this week', d.week.length, d.week.length > 5 ? 'warn' : '')}${card('Running now', d.running.length, '', d.running.map(r => r.station).join(', '))}${card('Blocked', d.blocked.length, d.blocked.length ? 'bad' : '')}${card('New RFQs', d.new_rfq, d.new_rfq ? 'warn' : '')}${card('Quotes to follow up', d.quotes_followup.length, d.quotes_followup.length ? 'warn' : '')}${card('Open jobs', d.kpi.open_jobs)}${card('Machine hours, 7 days', d.kpi.hours_this_week)}${card('On-time this month', d.kpi.on_time == null ? '-' : d.kpi.on_time + '%', d.kpi.on_time != null && d.kpi.on_time < 90 ? 'warn' : '')}${card('Quote win rate', d.kpi.win_rate == null ? '-' : d.kpi.win_rate + '%')}${card('Scrap this month', d.kpi.scrap.s, d.kpi.scrap.s ? 'warn' : '', `of ${d.kpi.scrap.q} pcs`)}${card('Reorder items', d.reorder.length, d.reorder.length ? 'warn' : '')}</div>
      <div class="row2"><div class="pane"><h3>Needs attention</h3>${[...d.late.map(j => `<div>🔴 <a href="#jobs/${j.id}">${esc(j.no)}</a> ${esc(j.part)} for ${esc(j.customer)} — due ${esc(j.due)}, ${tag(j.status)}</div>`), ...d.blocked.map(o => `<div>⛔ <a href="#jobs/${o.job_id}">${esc(o.job_no)}</a> ${esc(o.name)} on ${esc(o.station)}: <b>${esc(o.block_reason)}</b></div>`), ...d.quotes_followup.map(q => `<div>📨 Quote <a href="#sales/${q.id}">${esc(q.no)}</a> ${esc(q.customer)} ${money(q.quote_total)} — no answer since ${esc(q.quoted_at)}</div>`), ...d.machines.filter(x => x.status !== 'ok' || (x.next_pm && x.next_pm <= d.today)).map(x => `<div>🔧 ${esc(x.name)} ${x.status !== 'ok' ? tag(x.status) : 'PM due ' + esc(x.next_pm)}</div>`), ...d.facilities_due.map(f => `<div>🏭 ${esc(f.name)} — ${f.renew_on < d.today ? '<b class="err">overdue</b>' : 'due'} ${esc(f.renew_on)}</div>`), ...d.tools_due.map(t => `<div>🛠 ${esc(t.machine_code)} T${t.num} ${esc(t.name)} — tool life ${Math.round(100*t.used_min/t.life_min)}% used</div>`)].join('') || '<div class="hint">Nothing urgent. Good.</div>'}</div>
      <div class="pane"><h3>Running now</h3>${d.running.map(r => `<div>▶ <b>${esc(r.station)}</b> ${esc(r.job_no)} ${esc(r.op)} — ${esc(r.operator)} since ${fmtT(r.start).slice(-8, -3)} (${since(r.start)})</div>`).join('') || '<div class="hint">No machine running right now.</div>'}<h3>Due this week</h3>${d.week.map(j => `<div><a href="#jobs/${j.id}">${esc(j.no)}</a> ${esc(j.part)} — ${esc(j.customer)} — ${esc(j.due)} ${tag(j.status)}</div>`).join('') || '<div class="hint">None</div>'}</div></div>`;
  },
  async sales(m, id){
    if (id) return rfqDetail(m, +id);
    const [rfqs, customers] = await Promise.all([api('rfqs'), api('customers')]);
    m.innerHTML = `<h2>Sales / RFQ</h2><div class="bar"><button class="pri" id="new">+ New RFQ</button><button id="newc">+ New customer</button><span class="hint">Intake, booking and billing agents in Claude write into these same records through the API.</span></div>
      <table class="g"><tr><th>RFQ</th><th>Customer</th><th>Items</th><th>Received</th><th>Due</th><th>Status</th><th>Quote</th><th>PO</th><th>Follow-up</th></tr>${rfqs.map(r => `<tr class="row" data-id="${r.id}"><td>${esc(r.no)}</td><td>${esc(r.customer || '')}</td><td>${JSON.parse(r.items || '[]').map(i => `${esc(i.part)} × ${i.qty}`).join('<br>')}</td><td>${esc(r.received || '')}</td><td>${esc(r.due || '')}</td><td>${tag(r.status)}</td><td>${money(r.quote_total)}</td><td>${esc(r.po_no || '')}</td><td>${r.status === 'quoted' && r.followup_at ? (r.followup_at <= new Date().toISOString().slice(0, 10) ? '<b class="err">follow up now</b>' : esc(r.followup_at)) : ''}</td></tr>`).join('')}</table>
      <h3>Customers</h3><table class="g"><tr><th>Name</th><th>Code</th><th>Contact</th><th>Email</th><th>Priority</th><th>Portal link</th></tr>${customers.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.code || '')}</td><td>${esc(c.contact || '')}</td><td>${esc(c.email || '')}</td><td>${c.priority}</td><td>${c.portal_token ? `<a href="/erp/portal.html?t=${c.portal_token}" target="_blank">open</a> <button data-copy="${location.origin}/erp/portal.html?t=${c.portal_token}" style="height:22px">copy</button>` : `<button data-portal="${c.id}" style="height:22px">create</button>`}</td></tr>`).join('')}</table>`;
    $$('tr.row').forEach(tr => tr.onclick = () => location.hash = '#sales/' + tr.dataset.id);
    $$('[data-copy]').forEach(b => b.onclick = () => { navigator.clipboard.writeText(b.dataset.copy); toast('Portal link copied'); }); $$('[data-portal]').forEach(b => b.onclick = async () => { await api(`customers/${b.dataset.portal}/portal`, 'POST', {}); route(); });
    const F = [['customer_id', 'Customer', 'select', customers.map(c => [c.id, c.name])], ['received', 'Received', 'date'], ['due', 'Customer due date', 'date'], ['notes', 'Notes', 'textarea']];
    $('#new').onclick = () => dlg('New RFQ', form(F, {received:new Date().toISOString().slice(0, 10)}) + `<h3>Items</h3><div id="its">${itemRow({})}</div><button id="addi" style="height:24px">+ item</button>`, async bg => { const o = read(bg, F); o.items = readItems(bg); const r = await api('rfqs', 'POST', o); location.hash = '#sales/' + r.id; });
    const FC = [['name', 'Company name'], ['code', 'Short code'], ['contact', 'Contact person'], ['email', 'Email'], ['phone', 'Phone'], ['priority', 'Priority', 'select', PRIO], ['qb_id', 'QuickBooks customer id'], ['notes', 'Notes', 'textarea']];
    $('#newc').onclick = () => dlg('New customer', form(FC, {priority:2}), async bg => { await api('customers', 'POST', read(bg, FC)); route(); });
  },
  async jobs(m, id){
    if (id) return jobDetail(m, +id);
    const jobs = await api('jobs'), q = {all:j => true, open:j => !['done', 'shipped'].includes(j.status), late:j => !['done', 'shipped'].includes(j.status) && j.due < new Date().toISOString().slice(0, 10)};
    let f = 'open';
    const draw = () => { m.innerHTML = `<h2>Jobs</h2><div class="bar">${can('office') ? '<button class="pri" id="new">+ New job (no RFQ)</button>' : ''}<select id="flt"><option value="open">Open</option><option value="late">Late</option><option value="all">All</option></select><input id="srch" placeholder="search part / customer / job no" style="width:260px"></div>
      <table class="g"><tr><th>Job</th><th>Customer</th><th>Part</th><th>Drawing</th><th>Qty</th><th>Due</th><th>Pri</th><th>Status</th><th>Progress</th><th>Now at</th><th>Est h</th></tr>${jobs.filter(q[f]).filter(j => !$('#srch') || !$('#srch').value || JSON.stringify(j).toLowerCase().includes($('#srch').value.toLowerCase())).map(j => `<tr class="row" data-id="${j.id}"><td>${esc(j.no)}</td><td>${esc(j.customer || '')}</td><td>${esc(j.part)}</td><td>${esc(j.drawing_no || '')} ${j.rev ? 'rev ' + esc(j.rev) : ''}</td><td>${j.qty}</td><td>${esc(j.due || '')}</td><td>${j.priority}</td><td>${tag(j.status)}</td><td>${j.done_ops}/${j.ops}</td><td>${esc(j.active_at || '')}</td><td>${j.est_hours ?? ''}</td></tr>`).join('')}</table>`;
      $$('tr.row').forEach(tr => tr.onclick = () => location.hash = '#jobs/' + tr.dataset.id); $('#flt').value = f; $('#flt').onchange = () => { f = $('#flt').value; draw(); }; $('#srch').oninput = draw;
      if ($('#new')) $('#new').onclick = async () => { const customers = await api('customers'); const F = [['customer_id', 'Customer', 'select', customers.map(c => [c.id, c.name])], ['part', 'Part name'], ['drawing_no', 'Drawing no.'], ['rev', 'Revision'], ['material', 'Material'], ['qty', 'Quantity', 'number'], ['due', 'Due date', 'date'], ['priority', 'Priority', 'select', PRIO], ['price', 'Price (₱)', 'number'], ['notes', 'Notes', 'textarea']]; dlg('New job', form(F, {qty:1, priority:2, rev:'A'}), async bg => { const r = await api('jobs', 'POST', read(bg, F)); location.hash = '#jobs/' + r.id; }); };
    }; draw();
  },
  async planning(m){
    const b = await api('board');
    m.innerHTML = `<h2>Planning — sequence per station</h2><div class="hint" style="margin-bottom:8px">Drag a job up or down to change the sequence the operators see. 📌 pins a rush job to the top. The Floor Board updates within seconds. Jobs in grey are waiting for an earlier step at another station.</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px">${b.stations.map(s => `<div class="pane"><h3 style="margin-top:0">${esc(s.code)} <span class="hint">${s.hours} h lined up · ${s.days} days at ${s.hours_per_day} h/day</span>${s.days > 5 ? ' <span class="tag late">overloaded</span>' : ''}</h3><div class="qcol" data-st="${s.id}">${s.queue.map(o => `<div class="qitem ${o.status}" draggable="true" data-op="${o.id}"><span class="grip">⋮⋮</span><div class="h"><b>${esc(o.job_no)}</b> ${o.pinned ? '📌' : ''} ${esc(o.customer || '')}<br><span class="hint">${esc(o.name)} · due <span class="${o.late ? 'err' : ''}">${esc(o.due || '-')}</span> · ${hm(o.est_min)}${!o.ready ? ' · <span style="color:#D98E04">waiting</span>' : ''}${o.block_reason ? ' · <span class="err">' + esc(o.block_reason) + '</span>' : ''}</span></div>${tag(o.status)}<button data-pin="${o.id}" data-v="${o.pinned ? 0 : 1}" title="Pin to top" style="height:22px;padding:0 6px">📌</button>${o.status === 'blocked' ? `<button data-unblock="${o.id}" style="height:22px;padding:0 6px">release</button>` : ''}</div>`).join('') || '<div class="hint">empty</div>'}</div></div>`).join('')}</div>`;
    let drag = null;
    $$('.qitem').forEach(el => { el.ondragstart = e => { drag = el; e.dataTransfer.effectAllowed = 'move'; }; el.ondragover = e => { e.preventDefault(); if (drag && drag !== el && drag.parentElement === el.parentElement){ const r = el.getBoundingClientRect(); el.parentElement.insertBefore(drag, e.clientY < r.top + r.height/2 ? el : el.nextSibling); } }; el.ondragend = async () => { if (!drag) return; const list = [...drag.parentElement.children]; const idx = list.indexOf(drag); const id = drag.dataset.op; drag = null; await api(`ops/${id}/move`, 'POST', {index:idx}); toast('Sequence updated'); }; });
    $$('[data-pin]').forEach(b => b.onclick = async () => { const idx = +b.dataset.v ? 0 : [...b.closest('.qcol').children].indexOf(b.closest('.qitem')); await api(`ops/${b.dataset.pin}/move`, 'POST', {index:idx, pin:+b.dataset.v}); route(); });
    $$('[data-unblock]').forEach(b => b.onclick = async () => { await api(`ops/${b.dataset.unblock}/unblock`, 'POST', {}); route(); });
  },
  board(m){ m.innerHTML = `<h2>Floor Board</h2><p>Open on the floor TV in full screen (F11). One board for the whole floor, or one per area.</p><div class="bar"><a class="btn" style="line-height:28px" href="/erp/board.html" target="_blank">Whole floor</a><a class="btn" style="line-height:28px" href="/erp/board.html?station=CNC1,CNC2,WEDM" target="_blank">CNC and wire cut only</a><a class="btn" style="line-height:28px" href="/erp/board.html?station=LATHE,MILL,GRIND,DRILL,BENCH" target="_blank">Manual area</a><a class="btn" style="line-height:28px" href="/erp/board.html?view=today" target="_blank">Today view</a></div><h3>Operator app</h3><p>On the phone open <b>${location.origin}/erp/op.html</b> and choose "Add to home screen". Operators sign in with their name and PIN, pick their station, then Start / Pause / Finish. Start and Stop are kept on the phone when the Wi-Fi drops and sent later.</p><iframe src="/erp/board.html" style="width:100%;height:70vh;border:1px solid var(--bd);border-radius:6px;background:#0B1220"></iframe>`; },
  engineering(m){ m.innerHTML = `<h2>Engineering — Dynamic CAD/CAM</h2><p>Draw, model, program and estimate hours. Open a job from the Jobs page with "Open in CAD/CAM" so the program name and job number match.</p><div class="bar"><a class="btn pri" style="line-height:28px;color:#fff" href="/cam.html" target="_blank">Open Dynamic CAD/CAM</a></div><iframe src="/cam.html" style="width:100%;height:78vh;border:1px solid var(--bd);border-radius:6px"></iframe>`; },
  async quality(m){
    const [jobs, qa] = await Promise.all([api('jobs'), api('qa')]);
    const open = jobs.filter(j => ['in_progress', 'qa', 'done'].includes(j.status));
    m.innerHTML = `<h2>Quality</h2><div class="bar"><button class="pri" id="new">+ Inspection record</button></div><table class="g"><tr><th>When</th><th>Job</th><th>Kind</th><th>Result</th><th>Measured</th><th>Remarks</th><th>By</th></tr>${qa.map(q => { const j = jobs.find(x => x.id === q.job_id) || {}; return `<tr><td>${fmtT(q.at)}</td><td><a href="#jobs/${q.job_id}">${esc(j.no || q.job_id)}</a> ${esc(j.part || '')}</td><td>${esc(q.kind)}</td><td>${tag(q.result === 'pass' ? 'ok' : q.result === 'fail' ? 'late' : q.result)}</td><td>${esc(q.measured || '')}</td><td>${esc(q.remarks || '')}</td><td>${q.by_user || ''}</td></tr>`; }).join('') || '<tr><td colspan=7 class="hint">No records yet</td></tr>'}</table>`;
    const F = [['job_id', 'Job', 'select', open.map(j => [j.id, j.no + ' ' + j.part])], ['kind', 'Kind', 'select', [['first_article', 'First article'], ['in_process', 'In-process'], ['final', 'Final'], ['ncr', 'Non-conformance (NCR)'], ['complaint', 'Customer complaint']]], ['result', 'Result', 'select', [['pass', 'Pass'], ['fail', 'Fail'], ['rework', 'Rework']]], ['measured', 'Measured values'], ['remarks', 'Remarks', 'textarea']];
    $('#new').onclick = () => dlg('Inspection record', form(F), async bg => { await api('qa', 'POST', read(bg, F)); route(); });
  },
  async tools(m){
    const mc = localStorage.getItem('erp.tools.mc') || 'CNC1', tools = await api('tools?machine_code=' + mc);
    m.innerHTML = `<h2>Tools — ${esc(mc)}</h2><div class="bar"><select id="mc">${['CNC1', 'CNC2', 'WEDM', 'LATHE', 'GRIND'].map(x => `<option ${x === mc ? 'selected' : ''}>${x}</option>`).join('')}</select>${can('office') ? '<button class="pri" id="new">+ Tool</button><button id="imp">Import from Google Sheet CSV</button><button id="reo">Create reorder requests</button>' : ''}<a class="btn" style="line-height:28px" href="/api/tools/sheet?machine=${mc}&token=${TOKEN()}">Tool sheet CSV for the CAM</a><span class="hint">The CAM reads this list; operators tick Loaded and the pocket number here.</span></div>
      <table class="g"><tr><th>T</th><th>Pocket</th><th>Name</th><th>Type</th><th>Ø</th><th>Flutes</th><th>Flute len</th><th>Loaded</th><th>Stock</th><th>Min</th><th>Tool life</th><th></th></tr>${tools.sort((a, b) => a.num - b.num).map(t => `<tr><td>${t.num}</td><td>${t.pocket || ''}</td><td>${esc(t.name)}</td><td>${esc(t.type)}</td><td>${t.dia}</td><td>${t.flutes || ''}</td><td>${t.len || ''}</td><td><input type="checkbox" data-ld="${t.id}" ${t.loaded ? 'checked' : ''}></td><td class="${t.stock < t.min_stock ? 'err' : ''}">${t.stock}</td><td>${t.min_stock}</td><td>${t.life_min ? `<div class="prog" style="height:8px;background:#E6E9EF;border-radius:4px;width:90px;display:inline-block;vertical-align:middle"><i style="display:block;height:100%;width:${Math.min(100, Math.round(100*t.used_min/t.life_min))}%;background:${t.used_min >= t.life_min*0.9 ? '#C62828' : '#1E9E2E'};border-radius:4px"></i></div> ${hm(t.used_min)} / ${hm(t.life_min)}` : ''}</td><td><button data-edit="${t.id}" style="height:22px">edit</button> <button data-renew="${t.id}" style="height:22px" title="New tool fitted: life counter back to zero, stock minus one">changed</button></td></tr>`).join('')}</table>`;
    $('#mc').onchange = () => { localStorage.setItem('erp.tools.mc', $('#mc').value); route(); };
    $$('[data-ld]').forEach(c => c.onchange = () => api('tools/' + c.dataset.ld, 'PUT', {loaded:c.checked ? 1 : 0}));
    $$('[data-renew]').forEach(b => b.onclick = async () => { await api(`tools/${b.dataset.renew}/renew`, 'POST', {}); route(); });
    const F = [['num', 'T number', 'number'], ['pocket', 'Pocket', 'number'], ['name', 'Name'], ['type', 'Type', 'select', ['flat', 'bull', 'ball', 'face', 'chamfer', 'drill', 'spot', 'center', 'tap', 'ream', 'bore', 'tmill', 'insert', 'wire', 'wheel'].map(x => [x, x])], ['dia', 'Diameter', 'number'], ['flutes', 'Flutes', 'number'], ['len', 'Flute length', 'number'], ['stock', 'Stock (pcs)', 'number'], ['min_stock', 'Minimum stock', 'number'], ['life_min', 'Tool life (minutes in cut, 0 = off)', 'number'], ['notes', 'Notes']];
    $$('[data-edit]').forEach(b => b.onclick = () => { const t = tools.find(x => x.id === +b.dataset.edit); dlg('Tool ' + t.num, form(F, t), async bg => { await api('tools/' + t.id, 'PUT', read(bg, F)); route(); }); });
    if ($('#new')) $('#new').onclick = () => dlg('New tool', form(F, {machine_code:mc, stock:1, min_stock:1, type:'flat'}), async bg => { await api('tools', 'POST', Object.assign(read(bg, F), {machine_code:mc})); route(); });
    if ($('#imp')) $('#imp').onclick = () => dlg('Import tools from CSV', `<p class="hint">Paste the CSV of the ${esc(mc)} tab (File ▸ Download ▸ CSV in Google Sheets). Columns: num, name, type, dia, flutes, len, pocket, loaded.</p><textarea id="csv" rows="12" style="width:100%"></textarea>`, async bg => { const lines = bg.querySelector('#csv').value.trim().split(/\r?\n/); const hdr = lines.shift().split(',').map(h => h.trim().toLowerCase()); const rows = lines.map(l => { const v = l.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(x => x.replace(/,$/, '').replace(/^"|"$/g, '').replace(/""/g, '"')); const o = {}; hdr.forEach((h, i) => o[h] = v[i]); o.loaded = !/^(no|0|false|n)$/i.test(o.loaded || 'yes'); return o; }); const r = await api('tools/import', 'POST', {machine_code:mc, rows}); toast(`${r.imported} tools imported`); route(); }, 'Import');
    if ($('#reo')) $('#reo').onclick = async () => { const r = await api('reorder', 'POST', {}); toast(`${r.created} purchase request(s) created`); };
  },
  async materials(m){
    const [mats, prs] = await Promise.all([api('materials'), api('purchase_req')]);

      <div class="bar">${can('office') ? `<button class="pri" id="rt">Edit routing…</button>${j.status === 'planned' ? '<button class="ok" id="rel">Release to the floor</button>' : ''}${j.status === 'done' ? '<button id="ship">Ship…</button>' : ''}` : ''}<a class="btn" style="line-height:28px" href="/cam.html?job=${encodeURIComponent(j.no)}&part=${encodeURIComponent(j.part)}&material=${encodeURIComponent(j.material || '')}" target="_blank">📐 Open in CAD/CAM</a><a class="btn" style="line-height:28px" href="#costing/${j.id}">Costing</a><button id="trav">🖨 Traveller</button></div></div>
      <div class="pane" style="margin-top:10px"><h3 style="margin-top:0">Documents (drawing revisions)</h3><table class="g"><tr><th>Name</th><th>Rev</th><th>Status</th><th>Link</th><th>Uploaded</th></tr>${j.docs.map(d => `<tr><td>${esc(d.name)}</td><td>${esc(d.rev || '')}</td><td>${tag(d.status === 'current' ? 'ok' : 'late')} ${d.status}</td><td>${d.url ? `<a href="${esc(d.url)}" target="_blank">open</a>` : ''}</td><td>${fmtT(d.uploaded)}</td></tr>`).join('') || '<tr><td colspan=5 class="hint">No documents linked. A new revision with the same name supersedes the old one automatically.</td></tr>'}</table><div class="bar">${can('office') ? '<button id="doc">+ Document / revision</button>' : ''}${j.drive_url ? `<a class="btn" style="line-height:28px" href="${esc(j.drive_url)}" target="_blank">Drive folder</a>` : ''}</div></div>
      <div class="pane" style="margin-top:10px"><h3 style="margin-top:0">Quality</h3>${j.qa.map(q => `<div>${fmtT(q.at)} — ${esc(q.kind)} ${tag(q.result === 'pass' ? 'ok' : q.result === 'fail' ? 'late' : q.result)} ${esc(q.measured || '')} ${esc(q.remarks || '')} <span class="hint">${esc(q.by_name || '')}</span></div>`).join('') || '<div class="hint">No inspection records yet.</div>'}</div></div>
    <div class="pane"><table class="kv"><tr><td>Customer</td><td>${esc(j.customer ? j.customer.name : '')}</td></tr><tr><td>Drawing</td><td>${esc(j.drawing_no || '')} rev ${esc(j.rev || '')}</td></tr><tr><td>Material</td><td>${esc(j.material || '')}</td></tr><tr><td>Quantity</td><td>${j.qty}</td></tr><tr><td>Due</td><td>${esc(j.due || '')}</td></tr><tr><td>Priority</td><td>${j.priority}</td></tr><tr><td>Estimated hours</td><td>${j.est_hours ?? ''}</td></tr><tr><td>Price</td><td>${money(j.price)}</td></tr><tr><td>PO / RFQ</td><td>${j.rfq_id ? `<a href="#sales/${j.rfq_id}">RFQ</a>` : ''}</td></tr><tr><td>DR / Invoice</td><td>${esc(j.dr_no || '')} / ${esc(j.invoice_no || '')}</td></tr><tr><td>Notes</td><td>${esc(j.notes || '')}</td></tr></table><div class="bar">${can('office') ? '<button id="edit">Edit job</button>' : ''}</div>
      <h3>Time log</h3>${j.logs.slice(0, 30).map(l => `<div class="hint">${fmtT(l.start).slice(0, 16)} ${esc(l.user)} ${l.kind} ${esc(l.op)} ${l.end ? hm(l.minutes) : '<b>running</b>'}${l.note ? ' — ' + esc(l.note) : ''}</div>`).join('') || '<div class="hint">No time yet</div>'}</div></div>`;
  const FJ = [['part', 'Part'], ['drawing_no', 'Drawing no.'], ['rev', 'Revision'], ['material', 'Material'], ['qty', 'Quantity', 'number'], ['due', 'Due', 'date'], ['priority', 'Priority', 'select', PRIO], ['status', 'Status', 'select', JOB_ST], ['price', 'Price ₱', 'number'], ['drive_url', 'Drive folder'], ['notes', 'Notes', 'textarea']];
  if ($('#edit')) $('#edit').onclick = () => dlg('Edit ' + j.no, form(FJ, j), async bg => { await api('jobs/' + id, 'PUT', read(bg, FJ)); route(); });
  if ($('#rel')) $('#rel').onclick = async () => { try { await api(`jobs/${id}/release`, 'POST', {}); toast('Released — now on the Floor Board'); route(); } catch (e){ toast(e.message, true); } };
  if ($('#ship')) $('#ship').onclick = () => dlg('Ship', form([['dr_no', 'Delivery receipt no.']]), async bg => { await api(`jobs/${id}/ship`, 'POST', read(bg, [['dr_no']])); route(); }, 'Ship');
  if ($('#doc')) $('#doc').onclick = () => dlg('Document / revision', form([['name', 'Document name (same name = new revision)'], ['rev', 'Revision'], ['url', 'Link (Drive, PDF, STEP)']], {name:j.drawing_no || '', rev:j.rev || 'A'}), async bg => { await api('docs', 'POST', Object.assign(read(bg, [['name'], ['rev'], ['url']]), {job_id:id})); route(); });
  if ($('#rt')) $('#rt').onclick = () => { const rows = j.ops.length ? j.ops : [{station_id:ST[0].id, name:'', est_min:60}]; const rowHtml = o => `<div class="bar op" data-id="${o.id || ''}"><select class="s">${stOpts().map(x => `<option value="${x[0]}" ${+x[0] === +o.station_id ? 'selected' : ''}>${esc(x[1])}</option>`).join('')}</select><input class="n" placeholder="operation" value="${esc(o.name || '')}" style="width:220px"><input class="e" type="number" placeholder="min" value="${o.est_min || ''}" style="width:80px" title="estimated minutes"><input class="t" placeholder="tools T1 T6" value="${esc(o.tool_nums || '')}" style="width:100px" title="tool numbers used (for tool life)"><button class="x" style="height:24px">✕</button></div>`;
    const bg = dlg('Routing — ' + j.no, `<p class="hint">One line per operation, in the order the part moves through the shop. Minutes come from the CAD/CAM estimate (cutting + setup share). Operations already started are kept.</p><div id="ops">${rows.map(rowHtml).join('')}</div><button id="addop" style="height:24px">+ operation</button>`, async bg => { const ops = [...bg.querySelectorAll('.op')].map(r => ({id:+r.dataset.id || null, station_id:+r.querySelector('.s').value, name:r.querySelector('.n').value, est_min:+r.querySelector('.e').value || 0, tool_nums:r.querySelector('.t').value})).filter(o => o.name); await api(`jobs/${id}/routing`, 'POST', {ops}); route(); });
    bg.querySelector('#addop').onclick = () => bg.querySelector('#ops').insertAdjacentHTML('beforeend', rowHtml({station_id:ST[0].id, est_min:60})); bg.addEventListener('click', e => { if (e.target.classList.contains('x')) e.target.closest('.op').remove(); }); };
  $('#trav').onclick = () => { const w = window.open('', '_blank'); w.document.write(`<html><head><title>Traveller ${esc(j.no)}</title><style>body{font-family:Arial;padding:20px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #333;padding:6px;text-align:left}h1{margin:0}.qr{float:right;text-align:center;font-size:11px}</style></head><body><div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(j.no)}" width="140" height="140" onerror="this.replaceWith(document.createTextNode('QR: ${esc(j.no)}'))"><br>${esc(j.no)}</div><h1>${esc(j.no)}</h1><b>Dynamic Int'l. Precision Technology &amp; Tooling Inc.</b><p>Customer: <b>${esc(j.customer ? j.customer.name : '')}</b><br>Part: <b>${esc(j.part)}</b> · Drawing ${esc(j.drawing_no || '')} rev ${esc(j.rev || '')} · Material ${esc(j.material || '')}<br>Qty: <b>${j.qty}</b> · Due: <b>${esc(j.due || '')}</b> · Priority ${j.priority}</p><table><tr><th>#</th><th>Station</th><th>Operation</th><th>Est</th><th>Operator</th><th>Date</th><th>Qty OK</th><th>Scrap</th><th>QA</th></tr>${j.ops.map(o => `<tr><td>${o.seq}</td><td>${esc(o.station)}</td><td>${esc(o.name)}</td><td>${hm(o.est_min)}</td><td></td><td></td><td></td><td></td><td></td></tr>`).join('')}</table><p>Notes: ${esc(j.notes || '')}</p><p style="font-size:11px">Scan the QR with the Dynamic Operator app to start this job at your station.</p></body></html>`); w.document.close(); w.print(); };
}
boot();
</script></body></html>
